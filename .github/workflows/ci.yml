name: CI

on:
  pull_request:
    branches: [ '**' ]
  # На main проверки идут и после мержа: PR валидируется на своей базе, а два
  # зелёных по отдельности PR могут сложиться в красный main (переименовали
  # проп в одном, добавили использование старого в другом — текстового
  # конфликта нет). Здесь дополнительно проверяется итоговое состояние main.
  # После PR синхронизации release-0 проверяем и итоговый merge-коммит.
  # Именно этот прогон на вершине release-0 требуется предполёту релиза.
  push:
    branches: [ main, release-0 ]

# Проверкам нужен только исходник. Явный блок обязателен: без него джоба
# получает набор по умолчанию, а он в репозитории write.
permissions:
  contents: read

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci

      - name: Check circular dependencies
        run: npm run deps:cycles

      - name: Build library
        run: npm run build

      - name: Check React 18 and 19 consumers
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          npx playwright install --with-deps chromium
          archive=$(npm pack ./dist --pack-destination "$RUNNER_TEMP" --silent)
          for react in 18.3.1 19.3.1; do
            case "$react" in
              18.3.1) types=18.3.4 ;; # Нижняя поддерживаемая версия типов React 18.
              19.3.1) types=19.3.0 ;;
            esac
            for manager in npm pnpm; do
              consumer="$RUNNER_TEMP/triplex-$manager-$react"
              mkdir "$consumer"
              cp scripts/fixtures/react-consumer.tsx "$consumer/"
              (
                cd "$consumer"
                npm init -y >/dev/null
                packages=("$RUNNER_TEMP/$archive" "react@$react" "react-dom@$react" "@types/react@$types" "@types/react-dom@$types")
                if [ "$manager" = pnpm ]; then
                  npx --yes pnpm@10.34.5 add --ignore-scripts --strict-peer-dependencies "${packages[@]}"
                else
                  npm install --ignore-scripts --strict-peer-deps "${packages[@]}"
                fi
                "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --target ES2022 \
                  --module ESNext --moduleResolution bundler --jsx react-jsx react-consumer.tsx
                node "$GITHUB_WORKSPACE/scripts/checkReactConsumer.mjs" "$consumer" "${react%%.*}"
              )
            done
          done
  
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test-unit:coverage
      - name: Upload unit coverage
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage

  ai-md-tokens:
    name: AI.md tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check design tokens in AI.md
        run: npm run syncAiMdTokens -- --check

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests
        run: npm run test-e2e
