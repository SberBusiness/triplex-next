name: Visual Tests

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  visual:
    name: Visual regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Build Storybook
        run: npm run storybook:build
      - name: Check for orphan screenshots
        run: npx tsx scripts/checkOrphanScreenshots.ts
      - name: Run visual tests
        run: npx start-server-and-test 'npx http-server storybook-static -p 6006' http://localhost:6006 test-visual:ci
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diffs
          path: __screenshots__/__diff__
          if-no-files-found: ignore
