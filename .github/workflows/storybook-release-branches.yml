# Workflow для деплоя Storybook релизных веток, после влития в них PR.
# Релизные ветки, это main и ветки, начинающиеся с release-
name: Deploy Storybook for main & release branches

on:
  push:
    branches:
      - main
      - 'release-*'
  workflow_dispatch:

env:
  STORYBOOK_PREVIEW_BASE_TRIPLEX_DEV: "/var/www/storybook/data"
  STORYBOOK_URL_BASE_TRIPLEX_DEV: "https://storybook.triplex-dev.ru"
  STORYBOOK_PREVIEW_BASE_TRIPLEX_DESIGN: "/var/www/storybook/data"
  STORYBOOK_URL_BASE_TRIPLEX_DESIGN: "https://triplex-design.ru/storybook"

jobs:
  deploy-storybook:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run storybook:build

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Оба ключа загружаются в ssh-agent (по одному на сервер)
          ssh-private-key: |
            ${{ secrets.STORYBOOK_SSH_PRIVATE_KEY_TRIPLEX_DEV }}
            ${{ secrets.STORYBOOK_SSH_PRIVATE_KEY_TRIPLEX_DESIGN }}

      - name: Get deploy dir
        id: vars
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "preview_dir=main" >> $GITHUB_OUTPUT
          else
            echo "preview_dir=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      # Деплой на каждый сервер — независимый шаг с continue-on-error,
      # чтобы недоступность одного сервера не отменяла публикацию на другом.
      - name: Deploy Storybook to triplex-dev
        id: deploy_dev
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STORYBOOK_SSH_USER_TRIPLEX_DEV }} "mkdir -p $STORYBOOK_PREVIEW_BASE_TRIPLEX_DEV/${{ steps.vars.outputs.preview_dir }}"
          rsync -avz --delete storybook-static/ ${{ secrets.STORYBOOK_SSH_USER_TRIPLEX_DEV }}:$STORYBOOK_PREVIEW_BASE_TRIPLEX_DEV/${{ steps.vars.outputs.preview_dir }}/

      - name: Deploy Storybook to triplex-design
        id: deploy_design
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STORYBOOK_SSH_USER_TRIPLEX_DESIGN }} "mkdir -p $STORYBOOK_PREVIEW_BASE_TRIPLEX_DESIGN/${{ steps.vars.outputs.preview_dir }}"
          rsync -avz --delete storybook-static/ ${{ secrets.STORYBOOK_SSH_USER_TRIPLEX_DESIGN }}:$STORYBOOK_PREVIEW_BASE_TRIPLEX_DESIGN/${{ steps.vars.outputs.preview_dir }}/

      # Репорт результатов: warning на каждый упавший сервер,
      # job падает только если недоступны ОБА сервера.
      - name: Report deploy results
        if: always()
        run: |
          dev="${{ steps.deploy_dev.outcome }}"
          design="${{ steps.deploy_design.outcome }}"

          if [[ "$dev" == "success" ]]; then
            echo "triplex-dev:    $STORYBOOK_URL_BASE_TRIPLEX_DEV/${{ steps.vars.outputs.preview_dir }}"
          else
            echo "::warning::Деплой на triplex-dev не удался (outcome=$dev)"
          fi

          if [[ "$design" == "success" ]]; then
            echo "triplex-design: $STORYBOOK_URL_BASE_TRIPLEX_DESIGN/${{ steps.vars.outputs.preview_dir }}"
          else
            echo "::warning::Деплой на triplex-design не удался (outcome=$design)"
          fi

          if [[ "$dev" != "success" && "$design" != "success" ]]; then
            echo "::error::Оба сервера недоступны — деплой не выполнен ни на один из них"
            exit 1
          fi
