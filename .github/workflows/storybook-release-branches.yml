name: Deploy Storybook for main & release branches

on:
  push:
    branches: [main, release-0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test deployment scripts
        run: |
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
          node --test scripts/deploy/test-storybook-publication.cjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run storybook:build
      - name: Package static files
        run: tar -czf "$RUNNER_TEMP/storybook.tar.gz" -C storybook-static .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook--${{ github.ref_name }}--${{ github.sha }}
          path: ${{ runner.temp }}/storybook.tar.gz
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
          overwrite: true
