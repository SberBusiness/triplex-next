name: Auto PR

# Создаёт PR для веток задач Linear от аккаунта бота (secret DUDIM_AI_GH_TOKEN),
# чтобы автор PR не зависел от среды, где шла сессия агента (локально — PAT,
# в облаке прокси подменяет авторизацию на GitHub App). См. docs/ai/commits.md
# § «PR-воркфлоу».

on:
  push:
    branches:
      - 'TRI-*'

permissions:
  contents: read

# Два быстрых пуша подряд не должны давать второй (красный) прогон:
# упавший прогон по документации трактуется как сигнал для fallback.
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr:
    name: Create PR from bot account
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create PR if missing
        env:
          GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"

          subject=$(git log -1 --pretty=%s)
          # PR создаётся только для коммитов по конвенции TRI-XXX; [no-pr] — ручной опт-аут.
          if ! printf '%s' "$subject" | grep -qE '^TRI-[0-9]+ '; then
            echo "HEAD-коммит не в формате 'TRI-XXX ...' — PR не создаём"
            exit 0
          fi
          if printf '%s' "$subject" | grep -qF '[no-pr]'; then
            echo "Найден маркер [no-pr] — PR не создаём"
            exit 0
          fi

          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "Открытый PR для ветки $branch уже существует — выходим"
            exit 0
          fi

          # Свежая ветка от main без новых коммитов: gh pr create упал бы
          # с «No commits between…» — выходим штатно.
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$branch" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "Ветка $branch не содержит новых коммитов относительно main — PR не создаём"
            exit 0
          fi

          body=$(git log -1 --pretty=%b)
          if [ -z "$body" ]; then
            body="Автоматически созданный PR для ветки \`$branch\`."
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "$subject" --body "$body"
