name: Release, publish npm package & deploy Storybook

on:
  # Обычный путь: человек создаёт GitHub Release, workflow публикует.
  release:
    types: [published]

  # Путь для локальных агентов и CLI: тот же прогон, но релиз создаётся
  # внутри workflow, после успешной публикации.
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия и тег релиза, например 1.41.0"
        required: true
      target:
        description: "Ветка, на которую вешается тег"
        required: true
        default: main
      sha:
        description: "Проверенный merge SHA для сборки и тега; обязан лежать в target"
        required: false
      make_latest:
        description: "Пометить релиз как Latest — обязательно для 1.Y.0, запрещено для 0.Y.0"
        type: boolean
        default: false
      notes:
        description: "Текст release notes; пусто — собрать из MDX в репозитории"
        required: false

  # Автоматический путь: вызывается из release-weekly.yml как reusable workflow.
  #
  # Почему вызов, а не создание релиза снаружи: событие `release: published`,
  # порождённое GITHUB_TOKEN, по правилам GitHub не запускает другие workflow —
  # цепочка «создать релиз → опубликовать» молча оборвалась бы. Здесь публикация
  # и создание релиза живут в одном прогоне, поэтому от события ничего не зависит.
  #
  # Из облачной сессии Claude этот workflow не запустить: прокси режет write-пути
  # api.github.com (`gh release create`, `gh workflow run`, push тегов) — см.
  # TRI-119. Поэтому расписание держит сам GitHub, а не routine.
  workflow_call:
    inputs:
      tag:
        description: "Версия и тег релиза"
        required: true
        type: string
      target:
        description: "Ветка, на которую вешается тег"
        required: true
        type: string
      make_latest:
        description: "Пометить релиз как Latest (только для 1.x)"
        required: false
        default: false
        type: boolean
      # Точный коммит сборки и тега. `target` — имя ветки, и по нему
      # собралась бы её вершина на момент старта джобы — вместе со всем,
      # что влили после того, как вызывающий проверил состояние (TRI-155).
      sha:
        description: "Коммит для сборки и тега; обязан лежать в target. Пусто — вершина target"
        required: false
        default: ""
        type: string
      notes:
        description: "Текст release notes; пусто — собрать из MDX в репозитории"
        required: false
        default: ""
        type: string

# Shared by manual and reusable calls; distinct from Weekly release's group.
concurrency:
  group: release-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write   # нужно для создания релиза и загрузки ассетов
  id-token: write   # OIDC-токен для trusted publishing в npm (см. шаг Publish to npm)

env:
  STORYBOOK_PREVIEW_BASE: "/var/www/storybook/data"
  STORYBOOK_URL_BASE: "https://storybook.triplex-dev.ru"
  # Единый источник тега для обоих триггеров.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # Запускать workflow может любой с правом на Actions, а дальше идёт checkout
      # переданного ref и выполнение его npm-скриптов с npm-токеном и write-правами.
      # Поэтому пара «версия ↔ ветка» жёстко ограничена: 1.Y.0 только из main,
      # 0.Y.0 только из release-0. Проверка стоит до checkout намеренно.
      #
      # Гейт общий для обоих триггеров: на пути `release: published` ветку даёт
      # `target_commitish`. При создании релиза вручную нужен явный `--target`
      # с именем ветки. React 17 skill вызывает workflow_dispatch с точным SHA.
      # Если же релиз
      # повесить на уже существующий тег, GitHub подставит ветку по умолчанию —
      # для 0.Y.0 это осознанный стоп: такой релиз надо пересоздать
      # с `--target release-0`.
      - name: Validate release inputs
        env:
          TARGET: ${{ github.event.release.target_commitish || inputs.target }}
          MAKE_LATEST: ${{ inputs.make_latest }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! printf '%s' "${RELEASE_TAG}" | grep -qE '^[01]\.[0-9]+\.0$'; then
            echo "❌ tag=${RELEASE_TAG}: ожидается ровно 0.Y.0 или 1.Y.0 (минорный релиз, без prerelease)."
            exit 1
          fi
          case "${RELEASE_TAG}" in
            1.*) EXPECTED_TARGET=main ;;
            0.*) EXPECTED_TARGET=release-0 ;;
          esac
          if [ "${TARGET}" != "${EXPECTED_TARGET}" ]; then
            echo "❌ tag=${RELEASE_TAG} должен выпускаться из ветки ${EXPECTED_TARGET}, а не из ${TARGET}."
            exit 1
          fi

          # make_latest не свободный параметр: его однозначно задаёт тег.
          # `release-weekly.yml` передаёт правильные значения, но на пути
          # `workflow_dispatch` галку ставит человек, и ошибка там тихая:
          # 1.Y.0 с make_latest=false опубликуется в npm, а `latest` останется
          # на React 17-сборке. Отказ до публикации дешевле разбирательства
          # после неё — релиз отозвать нельзя.
          #
          # На пути `release: published` значения нет и шаг создания релиза
          # не выполняется: релиз уже создал человек, проверять нечего.
          if [ "${EVENT_NAME}" != "release" ]; then
            case "${RELEASE_TAG}" in
              1.*) EXPECTED_LATEST=true ;;
              0.*) EXPECTED_LATEST=false ;;
            esac
            if [ "${MAKE_LATEST}" != "${EXPECTED_LATEST}" ]; then
              echo "❌ tag=${RELEASE_TAG} требует make_latest=${EXPECTED_LATEST}, а передан '${MAKE_LATEST}'."
              exit 1
            fi
          fi

          # Переданный коммит обязан лежать в ветке target: иначе тег повис бы
          # на коммите, которого в ветке нет, а проверка ветки выше ничего бы
          # не значила. Через API — checkout ниже неглубокий, истории нет.
          if [ -n "${SHA:-}" ]; then
            # Ровно полный SHA: имя ветки прошло бы compare как identical
            # и незаметно вернуло бы сборку от вершины.
            if ! printf '%s' "${SHA}" | grep -qE '^[0-9a-f]{40}$'; then
              echo "❌ sha='${SHA}': ожидается полный SHA коммита (40 hex-символов)."
              exit 1
            fi
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...${TARGET}" --jq .status 2>/dev/null || echo "")
            case "${STATUS}" in
              ahead|identical) ;;
              *) echo "❌ sha=${SHA} не лежит в ветке ${TARGET} (compare: '${STATUS:-ошибка}')."; exit 1 ;;
            esac
          fi

      # При `release: published` GITHUB_SHA — коммит, на который повешен тег,
      # и checkout по умолчанию взял бы именно его.
      # При `workflow_dispatch` и `workflow_call` ветку для сборки задаёт вход
      # `target` — иначе для 0.x собрался бы main.
      #
      # Определение самого workflow при вызове берётся из ветки вызывающего,
      # то есть из main. Копия этого файла в `release-0` не используется ни на
      # одном пути и подтянется при следующем перелитии.
      #
      # Если передан `sha`, собирается ровно он, а не вершина `target`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || inputs.target || github.sha }}
          # workflow не пушит в репозиторий; gh получает токен через env явно
          persist-credentials: false

      - name: Validate release tag against checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_TAG: ${{ github.event_name == 'release' }}
        run: &validate-release-tag |
          SHA=$(git rev-parse HEAD)
          # Уже существующий тег `gh release create --target` не двигает:
          # релиз повис бы на чужом коммите, а пакет ушёл бы из SHA.
          # Совпадающий тег — штатно: повторный прогон после создания релиза.
          # Только HTTP 404 подтверждает отсутствие тега. Ошибка API или
          # неожиданный ответ останавливают дальнейшие этапы выпуска.
          TAG_SHA=""
          if TAG_RESPONSE=$(gh api --include "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${RELEASE_TAG}" 2>/dev/null); then
            TAG_SHA=$(printf '%s\n' "$TAG_RESPONSE" | awk 'body {print} /^\r?$/ {body=1}' |
              jq -er '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))') || {
              echo '❌ Не удалось прочитать SHA существующего тега; дальнейшие этапы остановлены.'; exit 1;
            }
          elif [ "$(printf '%s\n' "$TAG_RESPONSE" | awk 'NR==1 && /^HTTP\// {print $2}')" != 404 ]; then
            echo '❌ Статус тега неизвестен из-за ошибки API; повторите запрос перед продолжением.'; exit 1
          fi
          if [ -z "$TAG_SHA" ] && [ "$REQUIRE_TAG" = true ]; then
            echo '❌ Тег опубликованного Release отсутствует; дальнейшие этапы остановлены.'
            exit 1
          fi
          if [ -n "${TAG_SHA}" ] && [ "${TAG_SHA}" != "${SHA}" ]; then
            echo "❌ тег ${RELEASE_TAG} уже есть и указывает на ${TAG_SHA:0:8}, а собираем ${SHA:0:8}."
            echo "   Релиз повис бы не на опубликованном коммите. Разберись с тегом перед продолжением выпуска."
            exit 1
          fi

      # GITHUB_TOKEN cannot create a release whose target has different workflow
      # files from the default branch. Stop before npm publishes an immutable version.
      - name: Check workflow compatibility for GitHub Release
        id: compatibility
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECKOUT_SHA=$(git rev-parse HEAD)
          # A completed publication only needs asset recovery, not a new Release.
          # Unknown API/registry state never enables this exception.
          if RELEASE_INFO=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null) &&
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .published_at != null' <<< "$RELEASE_INFO" >/dev/null &&
            TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${RELEASE_TAG}" --jq .sha 2>/dev/null) &&
            [ "$TAG_SHA" = "$CHECKOUT_SHA" ] &&
            MANIFEST=$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://registry.npmjs.org/@sberbusiness%2Ftriplex-next/${RELEASE_TAG}" 2>/dev/null) &&
            jq -e --arg tag "$RELEASE_TAG" --arg sha "$CHECKOUT_SHA" '.name == "@sberbusiness/triplex-next" and .version == $tag and .gitHead == $sha' <<< "$MANIFEST" >/dev/null; then
            echo 'recovery=true' >> "$GITHUB_OUTPUT"
            echo 'Release, тег и npm-версия подтверждают SHA checkout: разрешено восстановление ассетов.'
            exit 0
          fi
          DEFAULT_BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          git fetch --no-tags --depth=1 origin "refs/heads/${DEFAULT_BRANCH}"
          if ! git diff --quiet HEAD FETCH_HEAD -- .github/workflows; then
            echo '❌ Workflow-файлы целевого SHA отличаются от основной ветки; GITHUB_TOKEN не сможет создать Release.'
            echo 'Публикация не началась. Восстановление: docs/human/release.md, «Если проверка публикации остановила выпуск».'
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          scope: '@sberbusiness'
          always-auth: true

      - run: npm ci
      - run: npm run build

      # Node 22 приносит npm 10.x, а обмен OIDC-токена на креденшл публикации
      # появился в 11.5.1. Без обновления publish молча ушёл бы в авторизацию
      # по NPM_AUTH_TOKEN — без provenance и с долгоживущим секретом.
      #
      # Версия точная, а не `@latest`: это последняя установка перед шагом,
      # который публикует пакет с креденшлом реестра, и лотерее там не место.
      # Плюс эксплуатационное: npm 12 требует Node ^22.22.2, тогда как 11.x
      # довольствуется >=22.9.0 — с `@latest` релиз зависел бы от того, какой
      # именно Node 22.x оказался на раннере. Двигать версию — осознанный шаг
      # вместе с апгрейдом Node.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.19.1
          npm --version

      # Публикация. Авторизация — trusted publishing: npm доверяет workflow
      # конкретного репозитория и выдаёт креденшл на минуты в обмен
      # на OIDC-токен раннера (permissions.id-token выше). Provenance
      # добавляется при этом автоматически: опубликованная версия привязана
      # к коммиту и прогону, подмену видно через `npm audit signatures`.
      #
      # Какому workflow доверять, npm решает по имени **вызывающего** файла.
      # При `release: published` и `workflow_dispatch` это сам release.yml,
      # а при `workflow_call` из release-weekly.yml — release-weekly.yml, хотя
      # publish выполняется здесь. Поэтому в настройках пакета на npmjs
      # заведены оба trusted publisher'а (docs/human/release.md § «Что
      # настроено один раз»). Без второго еженедельный релиз молча уходил
      # по токену: так вышли 0.48.0 и 1.48.0 (TRI-152).
      #
      # NPM_AUTH_TOKEN оставлен как запасной путь на время миграции: если
      # обмен не состоится, npm авторизуется им, и релиз не сорвётся.
      # Убираем секрет только после публикации с provenance на обоих путях —
      # ручном и еженедельном через release-weekly.yml (TRI-140, TRI-152).
      # .npmrc отдельно не пишем — его создаёт actions/setup-node выше,
      # подставляя NODE_AUTH_TOKEN.
      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          RECOVERY_ONLY: ${{ steps.compatibility.outputs.recovery == 'true' }}
        run: |
          cd dist
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${PKG_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "❌ dist/package.json version (${PKG_VERSION}) != release tag (${RELEASE_TAG})"
            exit 1
          fi
          case "${RELEASE_TAG}" in
            0.*|1.*) ;;
            *) echo "❌ Unknown version prefix: ${RELEASE_TAG}. Expected 0.* or 1.*."; exit 1 ;;
          esac
          # Повторный прогон после падения на заливке ассетов или деплое не должен
          # спотыкаться о «version already exists»: если ровно эта версия уже
          # в реестре, публикацию пропускаем и идём дальше — досоздавать релиз,
          # ассеты и Storybook.
          # `published=false` — для Verify provenance: этот прогон ничего
          # не публиковал, и о способе авторизации ему сказать нечего.
          BUILD_SHA=$(git rev-parse HEAD)
          # Keep the source SHA in packages/assets on initial runs and retries.
          npm pkg set "gitHead=${BUILD_SHA}"
          if PUBLISHED_METADATA=$(npm view "@sberbusiness/triplex-next@${RELEASE_TAG}" --json --prefer-online --registry=https://registry.npmjs.org 2>/dev/null); then
            jq -e --arg version "$RELEASE_TAG" --arg sha "$BUILD_SHA" \
              '.name == "@sberbusiness/triplex-next" and .version == $version and .gitHead == $sha' \
              <<< "$PUBLISHED_METADATA" >/dev/null || {
              echo '❌ Опубликованная npm-версия не подтверждает SHA этой сборки; Release и тег создавать нельзя.'
              echo 'Продолжайте исходный прогон с опубликованным SHA; см. docs/human/release.md.'
              exit 1
            }
            echo "⚠️ ${RELEASE_TAG} уже опубликована из ${BUILD_SHA} — публикацию пропускаем."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! jq -e '.error.code == "E404"' <<< "$PUBLISHED_METADATA" >/dev/null; then
            echo '❌ Не удалось подтвердить наличие npm-версии; публикация остановлена до восстановления доступа к реестру.'
            exit 1
          fi
          if [ "${RECOVERY_ONLY:-false}" = true ]; then
            echo '❌ Режим восстановления: npm не подтверждает версию; npm publish не запускаем.'
            exit 1
          fi
          # Порядок половин — не только договорённость скилов: во внутреннем
          # registry latest встаёт на последнюю опубликованную версию, поэтому
          # 1.Y.0, вышедшая раньше парной 0.Y.0, гарантированно оставит там
          # latest на React 17-сборке.
          # Гейт стоит после пропуска выше: повторный прогон по уже
          # опубликованной версии до него не доходит и восстановление не ломает.
          #
          # Свежая 0.Y.0 появляется в реестре не сразу: npm принимает publish
          # мгновенно, а отдаёт версию через минуты (TRI-147 — 2–3, TRI-151 —
          # 8,5). При ручном догоне половины идут подряд, и без ожидания гейт
          # ложно решил бы, что React 17-половина не вышла (TRI-153). Ждём
          # до 15 минут; реестр опрашиваем напрямую, в обход кеша npm.
          # Упавший curl — это 000, даже если заголовок 200 успел прийти:
          # `-w` печатает код и при оборванной передаче.
          case "${RELEASE_TAG}" in
            1.*)
              PAIRED_V0="0.${RELEASE_TAG#1.}"
              PAIRED_URL="https://registry.npmjs.org/@sberbusiness%2Ftriplex-next/${PAIRED_V0}"
              DEADLINE=$((SECONDS + 900))
              until CODE=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "${PAIRED_URL}") || CODE=000; [ "${CODE}" = "200" ]; do
                if [ "${SECONDS}" -ge "${DEADLINE}" ]; then
                  # 404 — версии действительно нет; 000/5xx — реестр не ответил,
                  # и советовать выпускать 0.Y.0 было бы неверно.
                  if [ "${CODE}" = "404" ]; then
                    echo "❌ Парная ${PAIRED_V0} не появилась в реестре за 15 минут — React 17-половина обязана выйти первой."
                    echo "   Выпустите ${PAIRED_V0} из release-0 и повторите (см. .agents/skills/release/SKILL.md)."
                  else
                    echo "❌ Реестр не ответил на проверку парной ${PAIRED_V0} (последний ответ: HTTP ${CODE})."
                    echo "   Опубликована ли React 17-половина, неизвестно — проверь и перезапусти упавшие джобы."
                  fi
                  exit 1
                fi
                echo "… ${PAIRED_V0} пока не видна в реестре, ждём индексации"
                sleep 30
              done
              ;;
          esac
          # main may have changed during the build or the paired-version wait.
          # Fetch the remote default branch again immediately before publication.
          # A remaining race requires the same-SHA recovery documented below.
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            git -C .. fetch --no-tags --depth=1 origin HEAD
            if ! git -C .. diff --quiet HEAD FETCH_HEAD -- .github/workflows; then
              echo '❌ Workflow-файлы основной ветки изменились перед npm publish; публикация остановлена.'
              echo 'Восстановление: docs/human/release.md, «Если проверка публикации остановила выпуск».'
              exit 1
            fi
          fi
          # 0.Y.0 публикуется под своим dist-tag, 1.Y.0 — под дефолтным latest.
          #
          # Раньше обе половины шли без `--tag`: npm 10 молча уводил `latest`
          # назад на 0.Y.0, а публикация 1.Y.0 парой минут позже возвращала его
          # вперёд. npm 11 (пин @11.19.1 выше) так больше не умеет — прогон
          # 2026-09-18 упал на «Cannot implicitly apply the "latest" tag because
          # previously published version 1.46.0 is higher than the new version
          # 0.47.0» (TRI-146). Проверка в npm смотрит на дефолтность тега
          # (`highestVersionIsGreater && isDefaultTag`), поэтому явный тег её
          # снимает — и заодно убирает окно между половинами, когда
          # `npm install` на npmjs отдавал React 17-сборку.
          #
          # Порядок выпуска это не отменяет: во внутренний registry теги
          # не проносятся, `latest` там встаёт на последнюю опубликованную
          # версию, и 1.Y.0 обязана выйти второй — гейт выше остаётся в силе.
          case "${RELEASE_TAG}" in
            0.*) npm publish --access public --tag react17 ;;
            1.*) npm publish --access public ;;
          esac
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Релиз создаётся на путях workflow_dispatch и workflow_call — и только после того,
      # как пакет реально ушёл в npm: упавшая сборка или публикация не оставят
      # висящего релиза. Обратное не гарантируется — заливка ассетов и деплой
      # идут уже после создания, и их падение оставит релиз без dist.zip; такой
      # прогон можно перезапустить, публикация идемпотентна.
      # На пути `release: published` релиз уже существует.
      #
      # Значения идут через env, а не через ${{ }} прямо в run: их задаёт тот,
      # кто запускает workflow, и подстановка в shell была бы точкой инъекции.
      - name: Validate release tag against checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_TAG: ${{ github.event_name == 'release' }}
        run: *validate-release-tag

      - name: Create GitHub Release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_ONLY: ${{ steps.compatibility.outputs.recovery == 'true' }}
          NOTES: ${{ inputs.notes }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          # Checkout has already pinned the build; never resolve a moving branch again.
          TARGET=$(git rev-parse HEAD)
          if [ "${RECOVERY_ONLY:-false}" = true ]; then
            if RECOVERY_RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null) &&
              jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .published_at != null' <<< "$RECOVERY_RELEASE" >/dev/null; then
              echo 'Режим восстановления: используем существующий опубликованный Release.'
              exit 0
            fi
            echo '❌ Подтверждённый Release больше не доступен; режим восстановления не создаёт Release заново.'
            exit 1
          fi
          # Пустой notes — собрать из MDX рядом, по канону
          # .agents/skills/release/SKILL.md § «Преобразование MDX → release notes».
          # Так вызывающему не нужно тащить многокилобайтный текст через входы.
          if [ -n "${NOTES}" ]; then
            printf '%s' "${NOTES}" > release-notes.md
          else
            case "${RELEASE_TAG}" in
              0.*) MDX="stories/release-notes/v0/${RELEASE_TAG}.mdx" ;;
              1.*) MDX="stories/release-notes/v1/${RELEASE_TAG}.mdx" ;;
            esac
            if [ ! -f "${MDX}" ]; then
              echo "❌ notes не переданы, а ${MDX} не найден — release notes собрать не из чего."
              exit 1
            fi
            node scripts/releaseNotesMd.js "${MDX}" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "❌ release notes пустые — публиковать релиз с пустым описанием нельзя."
            exit 1
          fi
          if [ "${MAKE_LATEST}" = "true" ]; then LATEST_FLAG="--latest"; else LATEST_FLAG="--latest=false"; fi
          # Повторный прогон после падения на заливке ассетов или деплое: релиз
          # уже создан, и `gh release create` на нём упал бы, оборвав
          # восстановление. Пропускаем только создание — ассеты и деплой ниже
          # доедут до конца.
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "⚠️ Release ${RELEASE_TAG} уже существует — создание пропускаем."
          else
            gh release create "${RELEASE_TAG}" --target "${TARGET}" --title "${RELEASE_TAG}" \
              "${LATEST_FLAG}" --notes-file release-notes.md
          fi
          rm -f release-notes.md

      # Detect a conflicting tag created during the API call before uploading assets.
      - name: Validate release tag against checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_TAG: 'true'
        run: *validate-release-tag

      # Упаковать dist.zip как release asset.
      - name: Create dist.zip
        run: zip -r "dist-${RELEASE_TAG}.zip" dist

      # MCP-бандл собирается только для стабильных релизов React 18 (ровно 1.Y.0):
      # документация в 0.* (React 17) идентична, а два одинаковых бандла в разных
      # релизах сделали бы неоднозначным выбор источника для fetch-bundle.ts
      # в mcp-server. Проверка вынесена в отдельный шаг, потому что выражения
      # GitHub Actions не умеют регулярные выражения, а startsWith('1.') пропустил бы
      # и 1.40.1, и 1.4.0-beta.
      - name: Detect MCP bundle eligibility
        id: mcp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Versions outside 1.Y.0 never need MCP metadata or an API request.
          if [[ ! "$RELEASE_TAG" =~ ^1\.[0-9]+\.0$ ]]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo "MCP bundle не генерируется: tag=${RELEASE_TAG}."
            exit 0
          fi
          # Read the actual Release for React 18, including manual recovery.
          IS_PRERELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .prerelease)
          case "$IS_PRERELEASE" in true|false) ;; *) echo 'Неизвестен статус prerelease'; exit 1 ;; esac
          if [[ "$IS_PRERELEASE" == false ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "MCP bundle не генерируется: tag=${RELEASE_TAG}, prerelease=${IS_PRERELEASE}."
          fi

      - name: Generate MCP bundle
        if: steps.mcp.outputs.eligible == 'true'
        run: npm run generateMcpData -- --out "mcp-data-${RELEASE_TAG}.json"

      # gh release upload requires an existing Release; it never creates one
      # or chooses a default-branch target when the Release/tag disappeared.
      - name: Upload build artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "dist-${RELEASE_TAG}.zip" --clobber

      - name: Upload MCP bundle to GitHub Release
        if: steps.mcp.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "mcp-data-${RELEASE_TAG}.json" --clobber

      # ---- Сборка и деплой Storybook ----
      - name: Build Storybook
        run: npm run storybook:build

      # The trusted publisher on main receives only static files, never release code.
      - name: Package Storybook
        id: storybook
        run: |
          tar -czf "$RUNNER_TEMP/storybook.tar.gz" -C storybook-static .
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook--releases__${{ env.RELEASE_TAG }}--${{ steps.storybook.outputs.revision }}
          path: ${{ runner.temp }}/storybook.tar.gz
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      # Каким путём прошла авторизация, по логам publish не видно: при неудачном
      # обмене OIDC npm молча уходит на NODE_AUTH_TOKEN и публикует без
      # provenance. А от этого зависит решение «секрет NPM_AUTH_TOKEN можно
      # удалять» (TRI-140) — принимать его по вере нельзя. Здесь факт
      # проверяется у реестра и попадает в summary прогона.
      #
      # Шаг не гейт: provenance не влияет на работоспособность пакета,
      # и срывать из-за него уже состоявшуюся публикацию нечего.
      # Только после публикации именно в этом прогоне (`published == 'true'`):
      # на упавшем прогоне версии в реестре может не быть вовсе, а на повторном
      # publish пропущен, и attestations старого манифеста ничего не говорят
      # об авторизации текущего запуска — принять их за подтверждение OIDC
      # значило бы рискнуть преждевременным удалением секрета. Версия
      # в npm публикуется однажды, поэтому при `published == 'true'`
      # attestations в манифесте — ровно от этой публикации. Но и при упавшем
      # деплое после неё — отсюда `!cancelled()`: публикация состоялась,
      # и ответ нужен.
      #
      # Шаг последний намеренно. npm отдаёт свежую версию через минуты после
      # publish (TRI-147 — 2–3, TRI-151 — 8,5), и сразу после публикации шаг
      # получал 404 и отчитывался «реестр не ответил» — так в 0.48.0 и 1.48.0
      # потерялся сигнал об отсутствии provenance (TRI-153). В конце джобы
      # бо́льшую часть ожидания покрывает сборка Storybook, а остаток шаг
      # дожидается сам — до 15 минут, опрашивая реестр напрямую, в обход
      # кеша npm. Стоя сразу после publish, это ожидание задержало бы
      # создание релиза, ассеты и деплой.
      - name: Verify provenance
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        continue-on-error: true
        run: |
          set -u
          VERSION_URL="https://registry.npmjs.org/@sberbusiness%2Ftriplex-next/${RELEASE_TAG}"
          # Недоступность реестра — третий исход, и путать его с двумя
          # остальными нельзя: вывод «опубликовано по токену» стоит решения
          # не удалять секрет, а обратный — решения его удалить. Поэтому
          # «реестр не ответил» — только по истечении ожидания, а не на
          # первом 404 во время штатной индексации.
          DEADLINE=$((SECONDS + 900))
          until MANIFEST=$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${VERSION_URL}" 2>/dev/null); do
            if [ "${SECONDS}" -ge "${DEADLINE}" ]; then
              {
                echo "### ⚠️ Provenance не проверена"
                echo ""
                echo "Реестр не отдал \`${RELEASE_TAG}\` за 15 минут. Публикация состоялась,"
                echo "но каким путём прошла авторизация — неизвестно. Проверь вручную:"
                echo "\`npm view @sberbusiness/triplex-next@${RELEASE_TAG} dist.attestations\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "… ${RELEASE_TAG} пока не видна в реестре, ждём индексации"
            sleep 30
          done
          # Не-JSON в ответе (прокси, сбой реестра) — тоже «не проверена»:
          # принять его за пустые attestations значило бы ложно заявить
          # «опубликовано по токену».
          if ! ATT=$(echo "${MANIFEST}" | jq -c '.dist.attestations // empty' 2>/dev/null); then
            {
              echo "### ⚠️ Provenance не проверена"
              echo ""
              echo "Реестр вернул для \`${RELEASE_TAG}\` не JSON. Проверь вручную:"
              echo "\`npm view @sberbusiness/triplex-next@${RELEASE_TAG} dist.attestations\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${ATT}" ]; then
            # В reusable workflow GITHUB_WORKFLOW_REF указывает на вызывающий
            # файл — ровно тот, по которому npm искал trusted publisher.
            CALLER="${GITHUB_WORKFLOW_REF%%@*}"
            {
              echo "### ⚠️ Provenance отсутствует"
              echo ""
              echo "\`${RELEASE_TAG}\` опубликована **по токену**: обмен OIDC не состоялся."
              echo "Секрет \`NPM_AUTH_TOKEN\` удалять нельзя. Проверь trusted publishers"
              echo "в настройках пакета на npmjs: npm сверяет имя **вызывающего** workflow,"
              echo "поэтому нужны оба — \`release.yml\` (ручной релиз) и"
              echo "\`release-weekly.yml\` (еженедельный, вызов через \`workflow_call\`)."
              echo "В этом прогоне npm сверял \`${CALLER##*/}\` — начни с его записи."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ✅ Provenance на месте"
              echo ""
              echo "\`${RELEASE_TAG}\` опубликована через trusted publishing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
