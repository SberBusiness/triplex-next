# Обновления зависимостей и actions.
#
# Следим только за main: в release-0 обновления приезжают перелитием, отдельный
# поток PR туда ломал бы React 17-адаптации (см. docs/ai/commits.md).
#
# Понедельник, а не пятница: релиз выходит в пятницу, и обновления, приехавшие
# в день заморозки, некому смотреть.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Moscow
    # Очередь ревью не резиновая: пять PR в неделю разбираются, двадцать — нет.
    open-pull-requests-limit: 5
    # Группы — чтобы минорные обновления не превращались в десяток PR.
    # Мажоры в группы не входят намеренно: каждый приезжает отдельно и читается
    # отдельно, у них ломающие изменения. Исключение — группа vitest ниже.
    #
    # Пакет попадает в первую подходящую группу, поэтому vitest объявлен
    # раньше development: иначе development забрал бы его минорные обновления.
    groups:
      # vitest и @vitest/* держат друг друга на точной версии (peer
      # "vitest": "3.2.7", без ^): поставить можно только всех сразу, по одному
      # npm падает с ERESOLVE. Поэтому все обновления, включая мажоры, идут
      # одним PR. Мажор в группе — исключение из правила выше: одиночный PR
      # на мажор здесь не ставится в принципе.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # То же для security-обновлений: без группы Dependabot пришлёт
      # обновление одного пакета, и оно упадёт с ERESOLVE.
      vitest-security:
        applies-to: security-updates
        patterns: ["vitest", "@vitest/*"]
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
    # Выдержка перед обновлением: пакет, скомпрометированный через угон
    # аккаунта мейнтейнера, обычно вычищается из реестра за первые сутки-двое.
    # Неделя ожидания стоит нам недели отставания, а ловит целый класс атак
    # на цепочку поставок. Security-обновления идут мимо этой выдержки.
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # 0.24+ требует Storybook 10, проект на Storybook 9 — npm падает
      # с ERESOLVE. Группа не поможет: обновлять надо сам Storybook.
      # Снять вместе с миграцией на Storybook 10 (TRI-145).
      - dependency-name: "@storybook/test-runner"
        versions: [">=0.24.0"]
    # Конвенция TRI-XXX на бота не распространяется, см. docs/ai/commits.md.
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    # Actions обновляются одной пачкой: их немного, и разводить по PR нет смысла.
    # Это же единственный способ поддерживать пиннинг по SHA живым — руками
    # хеши не обновляет никто, и запиненная версия застревает навсегда.
    groups:
      actions:
        patterns: ["*"]
    # Та же выдержка, что и для npm: у actions угон аккаунта мейнтейнера
    # опаснее — код выполняется на раннере рядом с секретами. Градации по
    # semver здесь нет: Dependabot принимает её только для экосистем
    # с semver-версиями, а на github-actions отвергает весь конфиг.
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
