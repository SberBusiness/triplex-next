name: Release, publish npm package & deploy Storybook

on:
  # Обычный путь: человек создаёт GitHub Release, workflow публикует.
  release:
    types: [published]

  # Путь для локальных агентов и CLI: тот же прогон, но релиз создаётся
  # внутри workflow, после успешной публикации.
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия и тег релиза, например 1.41.0"
        required: true
      target:
        description: "Ветка, на которую вешается тег"
        required: true
        default: main
      make_latest:
        description: "Пометить релиз как Latest — обязательно для 1.Y.0, запрещено для 0.Y.0"
        type: boolean
        default: false
      notes:
        description: "Текст release notes; пусто — собрать из MDX в репозитории"
        required: false

  # Автоматический путь: вызывается из release-weekly.yml как reusable workflow.
  #
  # Почему вызов, а не создание релиза снаружи: событие `release: published`,
  # порождённое GITHUB_TOKEN, по правилам GitHub не запускает другие workflow —
  # цепочка «создать релиз → опубликовать» молча оборвалась бы. Здесь публикация
  # и создание релиза живут в одном прогоне, поэтому от события ничего не зависит.
  #
  # Из облачной сессии Claude этот workflow не запустить: прокси режет write-пути
  # api.github.com (`gh release create`, `gh workflow run`, push тегов) — см.
  # TRI-119. Поэтому расписание держит сам GitHub, а не routine.
  workflow_call:
    inputs:
      tag:
        description: "Версия и тег релиза"
        required: true
        type: string
      target:
        description: "Ветка, на которую вешается тег"
        required: true
        type: string
      make_latest:
        description: "Пометить релиз как Latest (только для 1.x)"
        required: false
        default: false
        type: boolean
      notes:
        description: "Текст release notes; пусто — собрать из MDX в репозитории"
        required: false
        default: ""
        type: string

permissions:
  contents: write   # нужно для создания релиза и загрузки ассетов
  id-token: write   # OIDC-токен для trusted publishing в npm (см. шаг Publish to npm)

env:
  STORYBOOK_PREVIEW_BASE: "/var/www/storybook/data"
  STORYBOOK_URL_BASE: "https://storybook.triplex-dev.ru"
  # Единый источник тега для обоих триггеров.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # Запускать workflow может любой с правом на Actions, а дальше идёт checkout
      # переданного ref и выполнение его npm-скриптов с npm-токеном и write-правами.
      # Поэтому пара «версия ↔ ветка» жёстко ограничена: 1.Y.0 только из main,
      # 0.Y.0 только из release-0. Проверка стоит до checkout намеренно.
      #
      # Гейт общий для обоих триггеров: на пути `release: published` ветку даёт
      # `target_commitish`. Оба скила создают релиз на ещё не существующем теге
      # и с явным `--target`, поэтому там всегда лежит имя ветки. Если же релиз
      # повесить на уже существующий тег, GitHub подставит ветку по умолчанию —
      # для 0.Y.0 это осознанный стоп: такой релиз надо пересоздать
      # с `--target release-0`.
      - name: Validate release inputs
        env:
          TARGET: ${{ github.event.release.target_commitish || inputs.target }}
          MAKE_LATEST: ${{ inputs.make_latest }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! printf '%s' "${RELEASE_TAG}" | grep -qE '^[01]\.[0-9]+\.0$'; then
            echo "❌ tag=${RELEASE_TAG}: ожидается ровно 0.Y.0 или 1.Y.0 (минорный релиз, без prerelease)."
            exit 1
          fi
          case "${RELEASE_TAG}" in
            1.*) EXPECTED_TARGET=main ;;
            0.*) EXPECTED_TARGET=release-0 ;;
          esac
          if [ "${TARGET}" != "${EXPECTED_TARGET}" ]; then
            echo "❌ tag=${RELEASE_TAG} должен выпускаться из ветки ${EXPECTED_TARGET}, а не из ${TARGET}."
            exit 1
          fi

          # make_latest не свободный параметр: его однозначно задаёт тег.
          # `release-weekly.yml` передаёт правильные значения, но на пути
          # `workflow_dispatch` галку ставит человек, и ошибка там тихая:
          # 1.Y.0 с make_latest=false опубликуется в npm, а `latest` останется
          # на React 17-сборке. Отказ до публикации дешевле разбирательства
          # после неё — релиз отозвать нельзя.
          #
          # На пути `release: published` значения нет и шаг создания релиза
          # не выполняется: релиз уже создал человек, проверять нечего.
          if [ "${EVENT_NAME}" != "release" ]; then
            case "${RELEASE_TAG}" in
              1.*) EXPECTED_LATEST=true ;;
              0.*) EXPECTED_LATEST=false ;;
            esac
            if [ "${MAKE_LATEST}" != "${EXPECTED_LATEST}" ]; then
              echo "❌ tag=${RELEASE_TAG} требует make_latest=${EXPECTED_LATEST}, а передан '${MAKE_LATEST}'."
              exit 1
            fi
          fi

      # При `release: published` GITHUB_SHA — коммит, на который повешен тег,
      # и checkout по умолчанию взял бы именно его.
      # При `workflow_dispatch` и `workflow_call` ветку для сборки задаёт вход
      # `target` — иначе для 0.x собрался бы main.
      #
      # Определение самого workflow при вызове берётся из ветки вызывающего,
      # то есть из main. Копия этого файла в `release-0` не используется ни на
      # одном пути и подтянется при следующем перелитии.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target || github.sha }}
          # workflow не пушит в репозиторий; gh получает токен через env явно
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          scope: '@sberbusiness'
          always-auth: true

      - run: npm ci
      - run: npm run build

      # Node 22 приносит npm 10.x, а обмен OIDC-токена на креденшл публикации
      # появился в 11.5.1. Без обновления publish молча ушёл бы в авторизацию
      # по NPM_AUTH_TOKEN — без provenance и с долгоживущим секретом.
      #
      # Версия точная, а не `@latest`: это последняя установка перед шагом,
      # который публикует пакет с креденшлом реестра, и лотерее там не место.
      # Плюс эксплуатационное: npm 12 требует Node ^22.22.2, тогда как 11.x
      # довольствуется >=22.9.0 — с `@latest` релиз зависел бы от того, какой
      # именно Node 22.x оказался на раннере. Двигать версию — осознанный шаг
      # вместе с апгрейдом Node.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.19.1
          npm --version

      # Публикация. Авторизация — trusted publishing: npm доверяет workflow
      # конкретного репозитория и выдаёт креденшл на минуты в обмен
      # на OIDC-токен раннера (permissions.id-token выше). Provenance
      # добавляется при этом автоматически: опубликованная версия привязана
      # к коммиту и прогону, подмену видно через `npm audit signatures`.
      #
      # Какому workflow доверять, npm решает по имени **вызывающего** файла.
      # При `release: published` и `workflow_dispatch` это сам release.yml,
      # а при `workflow_call` из release-weekly.yml — release-weekly.yml, хотя
      # publish выполняется здесь. Поэтому в настройках пакета на npmjs
      # заведены оба trusted publisher'а (docs/human/release.md § «Что
      # настроено один раз»). Без второго еженедельный релиз молча уходил
      # по токену: так вышли 0.48.0 и 1.48.0 (TRI-152).
      #
      # NPM_AUTH_TOKEN оставлен как запасной путь на время миграции: если
      # обмен не состоится, npm авторизуется им, и релиз не сорвётся.
      # Убираем секрет только после публикации с provenance на обоих путях —
      # ручном и еженедельном через release-weekly.yml (TRI-140, TRI-152).
      # .npmrc отдельно не пишем — его создаёт actions/setup-node выше,
      # подставляя NODE_AUTH_TOKEN.
      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          cd dist
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${PKG_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "❌ dist/package.json version (${PKG_VERSION}) != release tag (${RELEASE_TAG})"
            exit 1
          fi
          case "${RELEASE_TAG}" in
            0.*|1.*) ;;
            *) echo "❌ Unknown version prefix: ${RELEASE_TAG}. Expected 0.* or 1.*."; exit 1 ;;
          esac
          # Повторный прогон после падения на заливке ассетов или деплое не должен
          # спотыкаться о «version already exists»: если ровно эта версия уже
          # в реестре, публикацию пропускаем и идём дальше — досоздавать релиз,
          # ассеты и Storybook.
          if npm view "@sberbusiness/triplex-next@${RELEASE_TAG}" version >/dev/null 2>&1; then
            echo "⚠️ ${RELEASE_TAG} уже опубликована в npm — публикацию пропускаем."
            exit 0
          fi
          # Порядок половин — не только договорённость скилов: во внутреннем
          # registry latest встаёт на последнюю опубликованную версию, поэтому
          # 1.Y.0, вышедшая раньше парной 0.Y.0, гарантированно оставит там
          # latest на React 17-сборке.
          # Гейт стоит после пропуска выше: повторный прогон по уже
          # опубликованной версии до него не доходит и восстановление не ломает.
          case "${RELEASE_TAG}" in
            1.*)
              PAIRED_V0="0.${RELEASE_TAG#1.}"
              if ! npm view "@sberbusiness/triplex-next@${PAIRED_V0}" version >/dev/null 2>&1; then
                echo "❌ Парная ${PAIRED_V0} не опубликована — React 17-половина обязана выйти первой."
                echo "   Выпустите ${PAIRED_V0} из release-0 и повторите (см. .agents/skills/release/SKILL.md)."
                exit 1
              fi
              ;;
          esac
          # 0.Y.0 публикуется под своим dist-tag, 1.Y.0 — под дефолтным latest.
          #
          # Раньше обе половины шли без `--tag`: npm 10 молча уводил `latest`
          # назад на 0.Y.0, а публикация 1.Y.0 парой минут позже возвращала его
          # вперёд. npm 11 (пин @11.19.1 выше) так больше не умеет — прогон
          # 2026-09-18 упал на «Cannot implicitly apply the "latest" tag because
          # previously published version 1.46.0 is higher than the new version
          # 0.47.0» (TRI-146). Проверка в npm смотрит на дефолтность тега
          # (`highestVersionIsGreater && isDefaultTag`), поэтому явный тег её
          # снимает — и заодно убирает окно между половинами, когда
          # `npm install` на npmjs отдавал React 17-сборку.
          #
          # Порядок выпуска это не отменяет: во внутренний registry теги
          # не проносятся, `latest` там встаёт на последнюю опубликованную
          # версию, и 1.Y.0 обязана выйти второй — гейт выше остаётся в силе.
          case "${RELEASE_TAG}" in
            0.*) npm publish --access public --tag react17 ;;
            1.*) npm publish --access public ;;
          esac

      # Каким путём прошла авторизация, по логам publish не видно: при неудачном
      # обмене OIDC npm молча уходит на NODE_AUTH_TOKEN и публикует без
      # provenance. А от этого зависит решение «секрет NPM_AUTH_TOKEN можно
      # удалять» (TRI-140) — принимать его по вере нельзя. Здесь факт
      # проверяется у реестра и попадает в summary прогона.
      #
      # Шаг не гейт: provenance не влияет на работоспособность пакета,
      # и срывать из-за него уже состоявшуюся публикацию нечего.
      # Только после успешной публикации: на упавшем прогоне версии в реестре
      # может не быть вовсе, и отсутствие attestations означало бы «публикации
      # не было», а не «ушли по токену».
      - name: Verify provenance
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        run: |
          set -u
          # Недоступность реестра — третий исход, и путать его с двумя
          # остальными нельзя: вывод «опубликовано по токену» стоит решения
          # не удалять секрет, а обратный — решения его удалить.
          if ! ATT=$(npm view "@sberbusiness/triplex-next@${RELEASE_TAG}" dist.attestations --json 2>/dev/null); then
            {
              echo "### ⚠️ Provenance не проверена"
              echo ""
              echo "Реестр не ответил. Публикация \`${RELEASE_TAG}\` состоялась,"
              echo "но каким путём прошла авторизация — неизвестно. Проверь вручную:"
              echo "\`npm view @sberbusiness/triplex-next@${RELEASE_TAG} dist.attestations\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${ATT}" = "null" ] || [ -z "${ATT}" ]; then
            {
              echo "### ⚠️ Provenance отсутствует"
              echo ""
              echo "\`${RELEASE_TAG}\` опубликована **по токену**: обмен OIDC не состоялся."
              echo "Секрет \`NPM_AUTH_TOKEN\` удалять нельзя. Проверь trusted publishers"
              echo "в настройках пакета на npmjs: npm сверяет имя **вызывающего** workflow,"
              echo "поэтому нужны оба — \`release.yml\` (ручной релиз) и"
              echo "\`release-weekly.yml\` (еженедельный, вызов через \`workflow_call\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ✅ Provenance на месте"
              echo ""
              echo "\`${RELEASE_TAG}\` опубликована через trusted publishing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Релиз создаётся на путях workflow_dispatch и workflow_call — и только после того,
      # как пакет реально ушёл в npm: упавшая сборка или публикация не оставят
      # висящего релиза. Обратное не гарантируется — заливка ассетов и деплой
      # идут уже после создания, и их падение оставит релиз без dist.zip; такой
      # прогон можно перезапустить, публикация идемпотентна.
      # На пути `release: published` релиз уже существует.
      #
      # Значения идут через env, а не через ${{ }} прямо в run: их задаёт тот,
      # кто запускает workflow, и подстановка в shell была бы точкой инъекции.
      - name: Create GitHub Release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
          NOTES: ${{ inputs.notes }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          # Пустой notes — собрать из MDX рядом, по канону
          # .agents/skills/release/SKILL.md § «Преобразование MDX → release notes».
          # Так вызывающему не нужно тащить многокилобайтный текст через входы.
          if [ -n "${NOTES}" ]; then
            printf '%s' "${NOTES}" > release-notes.md
          else
            case "${RELEASE_TAG}" in
              0.*) MDX="stories/release-notes/v0/${RELEASE_TAG}.mdx" ;;
              1.*) MDX="stories/release-notes/v1/${RELEASE_TAG}.mdx" ;;
            esac
            if [ ! -f "${MDX}" ]; then
              echo "❌ notes не переданы, а ${MDX} не найден — release notes собрать не из чего."
              exit 1
            fi
            node scripts/releaseNotesMd.js "${MDX}" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "❌ release notes пустые — публиковать релиз с пустым описанием нельзя."
            exit 1
          fi
          if [ "${MAKE_LATEST}" = "true" ]; then LATEST_FLAG="--latest"; else LATEST_FLAG="--latest=false"; fi
          # Повторный прогон после падения на заливке ассетов или деплое: релиз
          # уже создан, и `gh release create` на нём упал бы, оборвав
          # восстановление. Пропускаем только создание — ассеты и деплой ниже
          # доедут до конца.
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "⚠️ Release ${RELEASE_TAG} уже существует — создание пропускаем."
          else
            gh release create "${RELEASE_TAG}" --target "${TARGET}" --title "${RELEASE_TAG}" \
              "${LATEST_FLAG}" --notes-file release-notes.md
          fi
          rm -f release-notes.md

      # Упаковать dist.zip как release asset.
      - name: Create dist.zip
        run: zip -r "dist-${RELEASE_TAG}.zip" dist

      # MCP-бандл собирается только для стабильных релизов React 18 (ровно 1.Y.0):
      # документация в 0.* (React 17) идентична, а два одинаковых бандла в разных
      # релизах сделали бы неоднозначным выбор источника для fetch-bundle.ts
      # в mcp-server. Проверка вынесена в отдельный шаг, потому что выражения
      # GitHub Actions не умеют регулярные выражения, а startsWith('1.') пропустил бы
      # и 1.40.1, и 1.4.0-beta.
      - name: Detect MCP bundle eligibility
        id: mcp
        env:
          # На пути workflow_dispatch поля release нет — релиз мы создаём сами
          # и всегда как стабильный, поэтому prerelease по умолчанию false.
          IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          if [[ "${IS_PRERELEASE}" == "false" && "${RELEASE_TAG}" =~ ^1\.[0-9]+\.0$ ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "MCP bundle не генерируется: tag=${RELEASE_TAG}, prerelease=${IS_PRERELEASE}."
          fi

      - name: Generate MCP bundle
        if: steps.mcp.outputs.eligible == 'true'
        run: npm run generateMcpData -- --out "mcp-data-${RELEASE_TAG}.json"

      # tag_name обязателен: без него action выводит тег из GITHUB_REF, а на пути
      # workflow_dispatch там `refs/heads/main`, а не `refs/tags/...` — action падает
      # с «GitHub Releases requires a tag». На пути `release: published` значение
      # совпадает с тем, что action вывел бы сам.
      #
      # fail_on_unmatched_files: по умолчанию action молча пропускает ненайденные
      # файлы — релиз опубликовался бы без архива, и это заметили бы уже потребители.
      - name: Upload build artifacts to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist-${{ env.RELEASE_TAG }}.zip
          fail_on_unmatched_files: true

      # Отдельным шагом: для 0.* бандла нет, и указывать его в files выше значило бы
      # ссылаться на несуществующий файл. Шаг идёт под тем же условием, что и
      # генерация, поэтому отсутствие файла здесь — тоже повод упасть.
      - name: Upload MCP bundle to GitHub Release
        if: steps.mcp.outputs.eligible == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: mcp-data-${{ env.RELEASE_TAG }}.json
          fail_on_unmatched_files: true

      # ---- Сборка и деплой Storybook ----
      - name: Build Storybook
        run: npm run storybook:build

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.STORYBOOK_SSH_PRIVATE_KEY }}

      - name: Deploy Storybook to server
        env:
          SSH_USER: ${{ secrets.STORYBOOK_SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER" "mkdir -p $STORYBOOK_PREVIEW_BASE/releases/${RELEASE_TAG}"
          rsync -avz --delete storybook-static/ "$SSH_USER:$STORYBOOK_PREVIEW_BASE/releases/${RELEASE_TAG}/"

      - name: Output Storybook URL
        run: echo "Storybook deployed ${STORYBOOK_URL_BASE}/releases/${RELEASE_TAG}"