name: Visual Tests

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  visual:
    name: Visual regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Build Storybook
        run: npm run storybook:build
      - name: Check for orphan screenshots
        run: npx tsx scripts/checkOrphanScreenshots.ts
      - name: Run visual tests
        run: npx start-server-and-test 'npx http-server storybook-static -p 6006' http://localhost:6006 test-visual:ci
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: __screenshots__/__diff__
          if-no-files-found: ignore
