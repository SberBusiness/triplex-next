name: Weekly release

# Еженедельный релиз целиком: предполёт → 0.Y.0 из release-0 → 1.Y.0 из main.
#
# Почему это workflow, а не облачная routine: прокси облачных сессий Claude
# режет write-пути api.github.com — `gh release create`, `gh workflow run`,
# создание и push тегов (TRI-119, зонд 2026-08-21). Изнутри Actions таких
# ограничений нет, поэтому расписание держит сам GitHub. За Claude остаётся
# чтение результата и отчёт в Linear.
#
# Что делает человек до запуска (docs/human/release.md):
#   1. домержить задачи спринта в main, дальше main заморожен;
#   2. пункты в stories/release-notes/v1/<VERSION>.mdx (пишутся по ходу спринта);
#   3. слить PR синхронизации main → release-0 с сохранением React 17,
#      дождаться зелёного ci.yml;
#   4. к 13:45 проверить, что прогон стартовал — расписание опаздывает,
#      и если его нет, запустить workflow_dispatch руками.
#   5. одобрить релизные PR: сначала React 17, затем React 18.
# Слияние после одобрения и публикацию выполняет workflow.

on:
  # Минута намеренно некруглая. Расписание Actions — best-effort, и на начале
  # часа очередь максимальная: прогон 2026-08-28 опоздал на 11 часов,
  # 2026-09-04 — на 4 (TRI-138). Оба раза релиз к моменту прихода уже был
  # выпущен вручную через workflow_dispatch, а опоздавший прогон уходил
  # в пустышку. Гарантии сдвиг минуты не даёт.
  schedule:
    - cron: "23 10 * * 5" # пятница 13:23 МСК

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только предполёт, без публикации"
        type: boolean
        default: false

# Пуши в защищённые ветки идут под PAT бота, а не под GITHUB_TOKEN: он
# не входит в списки branch protection. Значит workflow'у достаточно чтения,
# а write выдан точечно джобам публикации.
permissions:
  contents: read

# Два релиза одновременно — гарантированная путаница с dist-tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Предполёт. Только чтения: ни одного коммита, ни одной публикации.
  # Не сошлось — тихий выход, а не падение: незавершённая подготовка это
  # штатный исход недели, а не поломка.
  # ------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    # actions: read — для чтения прогонов ci.yml на release-0. Явный блок
    # обнуляет все неперечисленные scope, а вызов `gh api` ниже заглушён
    # (`2>/dev/null || echo ""`), поэтому отказ в правах выглядел бы как
    # «на release-0 нет прогонов ci.yml» и тихо отменял релиз.
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      version: ${{ steps.check.outputs.version }}
      v0: ${{ steps.check.outputs.v0 }}
      next: ${{ steps.check.outputs.next }}
      next0: ${{ steps.check.outputs.next0 }}
      main_sha: ${{ steps.check.outputs.main_sha }}
      release0_sha: ${{ steps.check.outputs.release0_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight checks
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          fail() { echo "⏭️ Релиза не будет: $1"; { echo "## Релиза не будет"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }

          git fetch origin main release-0 --quiet

          CURRENT=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          MINOR=$(printf '%s' "${CURRENT}" | cut -d. -f2)
          case "${CURRENT}" in
            1.*.0) ;;
            *) fail "версия в main = \`${CURRENT}\`, ожидался формат 1.Y.0" ;;
          esac

          VERSION="1.$((MINOR + 1)).0"
          V0="0.$((MINOR + 1)).0"
          NEXT="1.$((MINOR + 2)).0"
          NEXT0="0.$((MINOR + 2)).0"
          echo "Кандидат: ${VERSION} / ${V0}"

          # Миноры веток должны совпадать — иначе ветки разъехались.
          R0=$(git show origin/release-0:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$(printf '%s' "${R0}" | cut -d. -f2)" != "${MINOR}" ]; then
            fail "миноры разъехались: main \`${CURRENT}\`, release-0 \`${R0}\`"
          fi

          # Триггер релиза — заполненные release notes. Файл существует всегда:
          # заготовку создаёт предыдущий релиз. Значение имеет содержимое.
          MDX="stories/release-notes/v1/${VERSION}.mdx"
          git show "origin/main:${MDX}" > /tmp/notes.mdx 2>/dev/null \
            || fail "\`${MDX}\` нет в main — предыдущий релиз не создал заготовку, это аномалия"
          if [ "$(grep -vcE '^[[:space:]]*$|^import |^<Meta |^<Title>|^<Heading>.*</Heading>$' /tmp/notes.mdx)" -eq 0 ]; then
            fail "\`${MDX}\` — пустая заготовка, с прошлого релиза ничего не приехало"
          fi

          # Релизов ещё нет.
          for T in "${VERSION}" "${V0}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${T}" >/dev/null 2>&1; then
              fail "релиз \`${T}\` уже существует"
            fi
          done

          # Перелитие сделано человеком. Список недостающих коммитов пишем
          # в summary отдельно: без него сообщение об отказе бесполезно.
          if ! git merge-base --is-ancestor origin/main origin/release-0; then
            {
              echo "## Релиза не будет"
              echo ""
              echo "Перелитие main → release-0 не сделано или устарело. Не хватает коммитов:"
              echo ""
              echo '```'
              git log origin/main --not origin/release-0 --oneline | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "⏭️ Релиза не будет: перелитие main → release-0 не сделано"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CI зелёный ровно на вершине release-0.
          TIP=$(git rev-parse origin/release-0)
          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=release-0&per_page=1" \
            --jq '.workflow_runs[0] | "\(.head_sha) \(.status) \(.conclusion)"' 2>/dev/null || echo "")
          if [ -z "${RUN}" ]; then fail "на release-0 нет прогонов ci.yml"; fi
          set -- ${RUN}
          if [ "$1" != "${TIP}" ]; then
            fail "последний прогон ci.yml на release-0 — коммит \`${1:0:8}\`, а вершина \`${TIP:0:8}\`: проверялось не то состояние"
          fi
          if [ "$2" != "completed" ] || [ "$3" != "success" ]; then
            fail "CI на вершине release-0 не зелёный: \`$2/$3\`"
          fi

          {
            echo "## Предполёт пройден"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Выпускаем | \`${V0}\`, затем \`${VERSION}\` |"
            echo "| main | \`${CURRENT}\` |"
            echo "| main SHA | \`$(git rev-parse origin/main)\` |"
            echo "| release-0 | \`${R0}\`, CI зелёный на \`${TIP:0:8}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "ready=true"
            echo "version=${VERSION}"
            echo "v0=${V0}"
            echo "next=${NEXT}"
            echo "next0=${NEXT0}"
            # Проверенное состояние. Джобы ниже стартуют через десятки минут
            # и без этих SHA взяли бы текущие вершины — вместе со всем, что
            # влили после предполёта мимо его проверок (TRI-155).
            echo "main_sha=$(git rev-parse origin/main)"
            echo "release0_sha=${TIP}"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # React 17-половина готовится первой. Порядок обратен номерам версий
  # намеренно: теги не проносятся во внутренний npm registry, `latest`
  # встаёт на последнюю публикацию. Значит 1.Y.0 обязана выйти второй.
  # ------------------------------------------------------------------
  prepare-react17:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      branch: ${{ steps.bump.outputs.branch }}

    steps:
      # Подготовка не исполняет зависимости, сборку или project lifecycle scripts.
      # Полные build/unit/visual/security проверки пройдут на релизном PR.
      # Здесь берём ровно проверенную предполётом вершину release-0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release0_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Не готовим релиз из устаревшего состояния. Перед слиянием PR
      # finalize-react17 повторит проверку базы, а GitHub потребует strict CI.
      - name: Check release-0 is unchanged since preflight
        env:
          VERIFIED: ${{ needs.preflight.outputs.release0_sha }}
        run: |
          set -eu
          git fetch origin release-0 --quiet
          TIP=$(git rev-parse origin/release-0)
          if [ "${TIP}" != "${VERIFIED}" ]; then
            echo "❌ release-0 сдвинулся после предполёта: проверен ${VERIFIED:0:8}, сейчас ${TIP:0:8}."
            echo "   Новые коммиты не проходили проверку CI предполёта:"
            git log --oneline "${VERIFIED}..${TIP}" --max-count=20 | sed 's/^/     /'
            echo "   Ничего не опубликовано. Дождись зелёного ci.yml на новой вершине"
            echo "   release-0 и запусти Weekly release заново или «Re-run all jobs» —"
            echo "   не «Re-run failed jobs»: предполёт должен проверить новое состояние."
            {
              echo "### ❌ release-0 изменился после предполёта"
              echo ""
              echo "Проверен \`${VERIFIED:0:8}\`, сейчас \`${TIP:0:8}\`. Ничего не опубликовано."
              echo "Дождаться зелёного \`ci.yml\` на новой вершине и запустить прогон заново"
              echo "(или «Re-run all jobs», не «Re-run failed jobs»)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Та же сверка main, что в prepare-react18, но до публикации 0.Y.0.
      # Мерж, влитый в первые минуты прогона, остановит релиз здесь — пока
      # ничего не вышло и лечение штатное (перелить заново, новый прогон),
      # а не на полпути, когда 0.Y.0 уже опубликована и остаётся только
      # откатывать влитое. Позже этой точки мерж ловит prepare-react18.
      - name: Check main content is unchanged since preflight
        env:
          VERIFIED: ${{ needs.preflight.outputs.main_sha }}
        run: |
          set -eu
          git fetch origin main --quiet
          if ! git cat-file -e "${VERIFIED}^{commit}" 2>/dev/null; then
            echo "❌ Проверенный предполётом коммит main '${VERIFIED}' недоступен — сверить не с чем."
            exit 1
          fi
          if ! git diff --quiet "${VERIFIED}" origin/main; then
            echo "❌ Содержимое main изменилось после предполёта (проверен ${VERIFIED:0:8})."
            echo "   Влито после предполёта — этого нет в release-0:"
            git log --oneline "${VERIFIED}..origin/main" --max-count=20 | sed 's/^/     /'
            echo "   Ничего не опубликовано. Перелей main → release-0 заново, дождись"
            echo "   зелёного ci.yml и запусти Weekly release заново (или «Re-run all jobs»)."
            {
              echo "### ❌ main изменился после предполёта"
              echo ""
              echo "Ничего не опубликовано. Перелить \`main\` → \`release-0\` заново, дождаться"
              echo "зелёного \`ci.yml\` и запустить прогон заново (или «Re-run all jobs»)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Содержимое main совпадает с проверенным предполётом (${VERIFIED:0:8})."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Transfer release notes v1 → v0
        id: notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          V0: ${{ needs.preflight.outputs.v0 }}
          NEXT0: ${{ needs.preflight.outputs.next0 }}
        run: |
          set -eu
          SRC="stories/release-notes/v1/${VERSION}.mdx"
          DST="stories/release-notes/v0/${V0}.mdx"

          # Заполненный человеком v0 не трогаем: он мог осознанно разойтись
          # с v1 там, где формулировка для React 17-сборки иная.
          if [ -f "${DST}" ] \
            && [ "$(grep -vcE '^[[:space:]]*$|^import |^<Meta |^<Title>|^<Heading>.*</Heading>$' "${DST}")" -ne 0 ]; then
            echo "ℹ️ ${DST} заполнен вручную — оставляем как есть."
            # Ниже шаг коммита ждёт на один изменённый файл меньше.
            echo "v0_written=false" >> "${GITHUB_OUTPUT}"
          else
            sed -e "s|<Meta title=\"release-notes/v1/${VERSION}\" />|<Meta title=\"release-notes/v0/${V0}\" />|" \
                -e "s|<Title>v${VERSION}</Title>|<Title>v${V0}</Title>|" \
                "${SRC}" > "${DST}"
            grep -q "release-notes/v0/${V0}" "${DST}" || { echo "❌ подмена <Meta> не сработала"; exit 1; }
            grep -q "<Title>v${V0}</Title>" "${DST}" || { echo "❌ подмена <Title> не сработала"; exit 1; }
            echo "✅ notes перенесены из ${SRC}"
            echo "v0_written=true" >> "${GITHUB_OUTPUT}"
          fi

          cat > "stories/release-notes/v0/${NEXT0}.mdx" <<EOF
          import { Meta, Title, Heading } from "@storybook/addon-docs/blocks";

          <Meta title="release-notes/v0/${NEXT0}" />

          <Title>v${NEXT0}</Title>

          <Heading>Изменения</Heading>
          EOF

      - name: Bump, commit and push
        id: bump
        env:
          V0: ${{ needs.preflight.outputs.v0 }}
          NEXT0: ${{ needs.preflight.outputs.next0 }}
          V0_WRITTEN: ${{ steps.notes.outputs.v0_written }}
          DUDIM_AI_GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
        run: |
          set -eu
          npm version "${V0}" --no-git-tag-version --ignore-scripts
          git config user.name "dudim-ai"
          git config user.email "dudim-ai@users.noreply.github.com"
          git add package.json package-lock.json \
            "stories/release-notes/v0/${V0}.mdx" "stories/release-notes/v0/${NEXT0}.mdx"
          # Точный список путей: `git add stories/release-notes/v0/` затянул бы
          # в релизный коммит любой посторонний файл в каталоге.
          #
          # Проверяем состав, а не количество. Файлов бывает и 4, и 3:
          # заполненный человеком `${V0}.mdx` шаг переноса оставляет как есть
          # (docs/human/release.md, шаг 5), и тогда в staged diff его нет.
          # Жёсткое `-ne 4` роняло бы ровно этот поддержанный сценарий.
          REQUIRED="package.json package-lock.json stories/release-notes/v0/${NEXT0}.mdx"
          if [ "${V0_WRITTEN}" = "true" ]; then
            REQUIRED="${REQUIRED} stories/release-notes/v0/${V0}.mdx"
          fi
          STAGED=$(git diff --cached --name-only)
          for f in ${REQUIRED}; do
            printf '%s\n' "${STAGED}" | grep -qxF "${f}" || {
              echo "❌ ожидали изменение ${f}, а его нет в релизном коммите:"
              printf '%s\n' "${STAGED}"
              exit 1
            }
          done
          COUNT=$(printf '%s\n' "${STAGED}" | grep -c . || true)
          EXPECTED=$(printf '%s\n' ${REQUIRED} | grep -c .)
          if [ "${COUNT}" -ne "${EXPECTED}" ]; then
            echo "❌ в релизном коммите ${COUNT} файлов вместо ${EXPECTED}:"
            printf '%s\n' "${STAGED}"
            exit 1
          fi
          # Без префикса TRI-XXX: у Actions нет доступа к Linear, номер задачи
          # взять неоткуда, а выдумывать нельзя. Исключение зафиксировано
          # в docs/ai/commits.md; связь с трекером даёт skill release-auto,
          # он заводит задачу по итогам прогона.
          git commit -m "Подготовка релиза ${V0}"
          # PAT используется только для push в одноразовую ветку, не в release-0.
          BRANCH="prerelease-${V0}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push "https://x-access-token:${DUDIM_AI_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          {
            echo "branch=${BRANCH}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release branch: ${BRANCH}"
          echo "Prepared release SHA: $(git rev-parse HEAD)"

  open-react17:
    needs: [preflight, prepare-react17]
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.checks.outputs.pr }}
    steps:
      # A fresh runner and the exact workflow commit, with no dependency execution.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Open PR and wait for all required checks
        id: checks
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
          BRANCH: ${{ needs.prepare-react17.outputs.branch }}
          SHA: ${{ needs.prepare-react17.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.v0 }}
          BASE_BRANCH: release-0
        run: bash scripts/release/open-pr.sh

  finalize-react17:
    needs: [preflight, prepare-react17, open-react17]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for human review and merge release PR
        id: merge
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
          BASE_BRANCH: release-0
          BRANCH: ${{ needs.prepare-react17.outputs.branch }}
          SHA: ${{ needs.prepare-react17.outputs.sha }}
          PR: ${{ needs.open-react17.outputs.pr }}
          VERIFIED_MAIN: ${{ needs.preflight.outputs.main_sha }}
        run: bash scripts/release/finalize-pr.sh
      - name: Report stopped React 17 release
        if: failure()
        env:
          PR: ${{ needs.open-react17.outputs.pr }}
        run: |
          echo '### React 17 ещё не опубликована' >> "$GITHUB_STEP_SUMMARY"
          echo "Проверьте состояние PR #${PR}. При истечении ожидания одобрите PR и повторите failed jobs. Если PR уже слит, продолжайте текущий прогон без нового бампа; при изменении main или release-0 см. docs/human/release.md." >> "$GITHUB_STEP_SUMMARY"

  publish-react17:
    needs: [preflight, finalize-react17]
    uses: ./.github/workflows/release.yml
    # Права переиспользуемому workflow выдаёт вызывающая джоба: объявления
    # внутри release.yml могут их только сузить. Без id-token здесь обмен
    # OIDC-токена на креденшл npm не состоится.
    #
    # id-token — необходимое, но не достаточное условие. npm сверяет trusted
    # publisher по имени вызывающего workflow, то есть по этому файлу,
    # а не по release.yml, где выполняется publish. Поэтому release-weekly.yml
    # заведён на npmjs отдельным trusted publisher'ом рядом с release.yml
    # (docs/human/release.md § «Что настроено один раз», TRI-152).
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ needs.preflight.outputs.v0 }}
      target: release-0
      # Ровно релизный коммит, а не вершина ветки на момент старта (TRI-155).
      sha: ${{ needs.finalize-react17.outputs.sha }}
      make_latest: false
    secrets: inherit

  # ------------------------------------------------------------------
  # React 18-половина. Стартует только после подтверждённой публикации
  # 0.Y.0 — иначе `latest` остался бы на React 17-сборке.
  # ------------------------------------------------------------------
  prepare-react18:
    needs: [preflight, publish-react17]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      branch: ${{ steps.prepare.outputs.branch }}

    steps:
      # Текущая вершина main, а не проверенный предполётом SHA: релизный
      # коммит обязан лечь поверх вершины: перед слиянием проверяем,
      # что база не изменилась. Что вершина не принесла ничего нового, проверяет
      # следующий шаг.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # 0.Y.0 уже опубликована из release-0, содержащего проверенный
      # предполётом main. Если с тех пор в main что-то влили, 1.Y.0 собралась
      # бы вместе с этим — и молча разошлась бы с 0.Y.0, которая обязана быть
      # её точным аналогом (TRI-155).
      #
      # Сверяем содержимое, а не SHA. Равенство SHA сделало бы остановку
      # тупиковой: сдвинувшийся main не вернуть, а релизный коммит от старой
      # вершины не пройдёт проверку неизменности базы. Выход —
      # откатить влитое (revert вернёт дерево к проверенному) и перезапустить
      # упавшие джобы.
      - name: Check main content is unchanged since preflight
        env:
          VERIFIED: ${{ needs.preflight.outputs.main_sha }}
          V0: ${{ needs.preflight.outputs.v0 }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -eu
          # Недоступный коммит — не «содержимое изменилось»: отказ тот же,
          # но причина другая, и путать их в сообщении нельзя.
          if ! git cat-file -e "${VERIFIED}^{commit}" 2>/dev/null; then
            echo "❌ Проверенный предполётом коммит main '${VERIFIED}' недоступен — сверить не с чем."
            exit 1
          fi
          if ! git diff --quiet "${VERIFIED}" HEAD; then
            echo "❌ Содержимое main изменилось после предполёта (проверен ${VERIFIED:0:8})."
            echo "   ${V0} уже опубликована без этих изменений — собрать из них ${VERSION}"
            echo "   значит развести версии. Влито после предполёта:"
            git log --oneline "${VERIFIED}..HEAD" --max-count=20 | sed 's/^/     /'
            echo ""
            echo "   Выход, при котором ${VERSION} останется точным аналогом ${V0}:"
            echo "   откатить эти коммиты в main (revert), затем «Re-run failed jobs»"
            echo "   этого прогона. Вернуть изменения — после выхода ${VERSION}."
            echo "   Другие варианты — docs/human/release.md § «Если релиз выпущен наполовину»."
            {
              echo "### ❌ main изменился после предполёта"
              echo ""
              echo "\`${V0}\` опубликована, \`${VERSION}\` — нет. Откатить в \`main\` коммиты,"
              echo "влитые после \`${VERIFIED:0:8}\`, и перезапустить упавшие джобы."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Содержимое main совпадает с проверенным предполётом (${VERIFIED:0:8})."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Bump, commit and push release branch
        id: prepare
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NEXT: ${{ needs.preflight.outputs.next }}
          DUDIM_AI_GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
        run: |
          set -eu
          npm version "${VERSION}" --no-git-tag-version --ignore-scripts

          cat > "stories/release-notes/v1/${NEXT}.mdx" <<EOF
          import { Meta, Title, Heading } from "@storybook/addon-docs/blocks";

          <Meta title="release-notes/v1/${NEXT}" />

          <Title>v${NEXT}</Title>

          <Heading>Изменения</Heading>
          EOF

          git config user.name "dudim-ai"
          git config user.email "dudim-ai@users.noreply.github.com"
          git add package.json package-lock.json "stories/release-notes/v1/${NEXT}.mdx"
          COUNT=$(git diff --cached --name-only | wc -l)
          if [ "${COUNT}" -ne 3 ]; then
            echo "❌ в релизном коммите ${COUNT} файлов вместо 3:"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "Подготовка релиза ${VERSION}"

          # Одноразовая ветка проходит проверки и ревью через PR в main.
          # Каждая попытка получает свою ветку; чужие и прежние ветки не перезаписываем.
          BRANCH="prerelease-${VERSION}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push "https://x-access-token:${DUDIM_AI_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          {
            echo "branch=${BRANCH}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release branch: ${BRANCH}"
          echo "Prepared release SHA: $(git rev-parse HEAD)"

      - name: Report preparation failure
        if: failure()
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          V0: ${{ needs.preflight.outputs.v0 }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            echo "### Подготовка ${VERSION} остановлена"
            echo "${V0} уже опубликована. ${VERSION} ещё не опубликована."
            echo "Если ветка ${BRANCH:-prerelease} успела создаться, проверьте её и связанный PR."
            echo 'После исправления причины повторите подготовку с зависимыми jobs; новый коммит потребует нового ревью.'
            echo 'При изменении main сначала восстановите содержимое по docs/human/release.md.'
          } >> "$GITHUB_STEP_SUMMARY"

  open-react18:
    needs: [preflight, prepare-react18]
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.checks.outputs.pr }}
    steps:
      # A fresh runner and the exact workflow commit, with no dependency execution.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Open PR and wait for all required checks
        id: checks
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
          BRANCH: ${{ needs.prepare-react18.outputs.branch }}
          SHA: ${{ needs.prepare-react18.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          BASE_BRANCH: main
        run: bash scripts/release/open-pr.sh
      - name: Report React 18 PR check failure
        if: failure()
        env:
          PR: ${{ steps.checks.outputs.pr }}
          V0: ${{ needs.preflight.outputs.v0 }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            echo "### Открытие или проверки PR для ${VERSION} остановлены"
            echo "${V0} уже опубликована; ${VERSION} ещё не опубликована этим прогоном."
            if [ -n "$PR" ]; then
              echo "Проверьте [PR #${PR}](https://github.com/${GITHUB_REPOSITORY}/pull/${PR})."
            else
              echo 'Номер PR не получен. Проверьте существующий PR подготовленной ветки.'
            fi
            echo 'После устранения причины повторите failed jobs исходного прогона: открытие/проверки, без нового бампа.'
            echo 'При изменении SHA, базы или закрытом PR сначала выберите восстановление по docs/human/release.md.'
            echo 'Закрытый без слияния React 18 PR: см. одноимённый сценарий в руководстве; нужна повторная prepare-react18 с зависимыми jobs.'
          } >> "$GITHUB_STEP_SUMMARY"

  finalize-react18:
    needs: [preflight, prepare-react18, open-react18]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # A retry after a successful merge must not repeat preparation on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for human review and merge release PR
        id: merge
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
          BRANCH: ${{ needs.prepare-react18.outputs.branch }}
          SHA: ${{ needs.prepare-react18.outputs.sha }}
          PR: ${{ needs.open-react18.outputs.pr }}
          BASE_BRANCH: main
        run: bash scripts/release/finalize-pr.sh

      # Ветку и PR после падения намеренно НЕ удаляем: в них лежит релизный
      # коммит и результаты проверок — то, по чему разбирают причину. Но
      # молча оставленный мусор через месяц уже никто не свяжет с релизом,
      # поэтому пишем в summary, что именно осталось и что с этим делать.
      # Джоба стартует только после публикации 0.Y.0, поэтому «ничего
      # не опубликовано» здесь всегда про 1.Y.0 — так и пишем, иначе summary
      # выглядит как «релиза не было», хотя половина уже вышла.
      - name: Report leftovers on failure
        if: failure()
        env:
          BRANCH: ${{ needs.prepare-react18.outputs.branch }}
          PR: ${{ needs.open-react18.outputs.pr }}
          V0: ${{ needs.preflight.outputs.v0 }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -u
          if [ -z "${BRANCH}" ]; then
            {
              echo "### Релиз \`${VERSION}\` остановлен до создания релизной ветки"
              echo ""
              echo "Релизной ветки нет, \`${VERSION}\` не опубликована."
              echo "\`${V0}\` уже опубликована — релиз выпущен наполовину,"
              echo "см. docs/human/release.md § «Если релиз выпущен наполовину»."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Релиз остановлен на проверках"
            echo ""
            echo "Осталось в репозитории:"
            echo ""
            echo "- ветка \`${BRANCH}\` с релизным коммитом"
            if [ -n "${PR}" ]; then
              echo "- PR #${PR} — в нём видно, какая проверка упала"
            else
              echo "- PR создать не успели"
            fi
            echo ""
            echo "\`${VERSION}\` не опубликована (\`${V0}\` — уже). Почини причину"
            echo "и выбери восстановление по причине остановки:"
            echo "- Если main изменился до слияния: верни его содержимое к предполёту,"
            echo "  перезапусти именно \`prepare-react18\` вместе с зависимыми jobs"
            echo "  (даже если подготовка была зелёной) и заново одобри PR."
            echo "  Один \`Re-run failed jobs\` не обновит родителя релизного коммита."
            echo "- Если main не менялся или PR уже слит: \`Re-run failed jobs\`"
            echo "  повторит завершение с тем же PR и SHA, без нового бампа версии."
            echo 'Перед отменой выпуска проверьте состояние PR: открытый можно закрыть без слияния.'
            echo 'Если PR уже MERGED, удаление ветки не отменяет бамп: продолжайте failed jobs того же прогона.'
            echo 'Отмена после слияния требует отдельного восстановления версии через PR; см. docs/human/release.md.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-react18:
    needs: [preflight, finalize-react18]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ needs.preflight.outputs.version }}
      target: main
      # Коммит слияния после ревью. Его дерево сверено с проверенным PR;
      # последующие изменения main в публикацию не попадут.
      sha: ${{ needs.finalize-react18.outputs.sha }}
      make_latest: true
    secrets: inherit

  # ------------------------------------------------------------------
  # Финальная проверка. Джоба ходит на npmjs: checkout'а здесь нет, .npmrc
  # взяться неоткуда, @sberbusiness:registry не задан. После TRI-146 latest
  # там между половинами не двигается вовсе: 0.Y.0 уходит под тегом react17,
  # поэтому сверяются оба тега. Во внутреннем registry dist-tags нет, latest
  # определяется порядком появления версий, и его закрывает порядок половин.
  # ------------------------------------------------------------------
  verify:
    needs: [preflight, publish-react18]
    runs-on: ubuntu-latest

    steps:
      - name: Check dist-tags
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          V0: ${{ needs.preflight.outputs.v0 }}
        run: |
          set -eu
          REGISTRY="https://registry.npmjs.org"
          PKG="@sberbusiness%2Ftriplex-next"
          # npm принимает publish мгновенно, а dist-tags обновляет через
          # минуты: в TRI-151 `latest` встал на 1.48.0 через 8,5 минуты после
          # публикации, а джоба стартовала через 70 секунд, увидела 1.47.0 и
          # уронила прогон, предложив невыполнимый `npm dist-tag add` — версии
          # в реестре ещё не было (TRI-153). Поэтому ждём `latest` до 15 минут
          # с запасом над наблюдённым максимумом и только потом судим.
          #
          # Реестр опрашиваем curl'ом с no-cache, а не `npm view`: npm кеширует
          # пакумент локально (max-age=300), и повторный `npm view` мог бы
          # пять минут отдавать тот же устаревший latest.
          # react17 не ждём: 0.Y.0 вышла на десятки минут раньше и к этому
          # моменту проиндексирована, а ждать 15 минут ради предупреждения,
          # которое прогон не роняет, незачем.
          DEADLINE=$((SECONDS + 900))
          while :; do
            # Не-JSON (прокси, страница ошибки) — как пустой ответ: ждём дальше,
            # а не обрываем шаг под `set -e` без summary.
            TAGS=$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "${REGISTRY}/-/package/${PKG}/dist-tags" 2>/dev/null || echo '{}')
            LATEST=$(echo "${TAGS}" | jq -r '.latest // ""' 2>/dev/null || echo "")
            REACT17=$(echo "${TAGS}" | jq -r '.react17 // ""' 2>/dev/null || echo "")
            if [ "${LATEST}" = "${VERSION}" ] || [ "${SECONDS}" -ge "${DEADLINE}" ]; then
              break
            fi
            echo "… latest = ${LATEST:-?}, ждём ${VERSION}: реестр ещё индексирует публикацию"
            sleep 30
          done
          echo "dist-tags.latest = ${LATEST}"
          echo "dist-tags.react17 = ${REACT17}"
          {
            echo "## Релиз выпущен"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| \`${V0}\` | опубликована |"
            echo "| \`${VERSION}\` | опубликована |"
            echo "| \`dist-tags.latest\` | \`${LATEST}\` |"
            echo "| \`dist-tags.react17\` | \`${REACT17}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # react17 — тег, по которому ставятся React 17-потребители
          # (stories/Introduction.mdx). Прогон им не роняем: обе версии уже
          # опубликованы, релиз состоялся, а `npm install` по умолчанию
          # определяет latest, который проверяется ниже и остаётся гейтом.
          # Но и молчать нельзя: до TRI-146 тег не двигался с августа,
          # и `@react17` полтора месяца отдавал давнюю сборку.
          # Проверка идёт перед гейтом latest — иначе при красном latest
          # расхождение по react17 не попало бы в отчёт вовсе.
          if [ "${REACT17}" != "${V0}" ]; then
            echo "⚠️ dist-tags.react17 = ${REACT17}, ожидалось ${V0}."
            {
              echo ""
              echo "⚠️ \`dist-tags.react17\` = \`${REACT17}\`, ожидалось \`${V0}\`:"
              echo "\`npm i @sberbusiness/triplex-next@react17\` отдаёт не ту сборку."
              echo "Почини:"
              echo ""
              echo '```bash'
              echo "npm dist-tag add @sberbusiness/triplex-next@${V0} react17 \\"
              echo "  --@sberbusiness:registry=https://registry.npmjs.org/ \\"
              echo "  --registry=https://registry.npmjs.org/"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${LATEST}" != "${VERSION}" ]; then
            echo "❌ latest = ${LATEST}, ожидалось ${VERSION} — не встал за 15 минут."
            # Команда починки имеет смысл, только если версия в реестре есть:
            # иначе `npm dist-tag add` упадёт на несуществующей версии.
            # `|| CODE=000`: сетевая ошибка curl под `set -e` оборвала бы шаг
            # без подсказки, а так уйдёт в ветку ниже с HTTP 000. Упавший curl —
            # 000, даже если заголовок 200 успел прийти: `-w` печатает код
            # и при оборванной передаче.
            CODE=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "${REGISTRY}/${PKG}/${VERSION}") || CODE=000
            if [ "${CODE}" = "200" ]; then
              echo "   ${VERSION} в реестре есть, тег на неё не встал."
              echo "   npm install отдаёт потребителям не ту сборку — почини немедленно:"
              echo "   npm dist-tag add @sberbusiness/triplex-next@${VERSION} latest \\"
              echo "     --@sberbusiness:registry=https://registry.npmjs.org/ \\"
              echo "     --registry=https://registry.npmjs.org/"
            else
              echo "   ${VERSION} в реестре не видна (HTTP ${CODE}): публикация не дошла"
              echo "   или реестр задерживает индексацию. Проверь через несколько минут:"
              echo "   npm view @sberbusiness/triplex-next dist-tags \\"
              echo "     --@sberbusiness:registry=https://registry.npmjs.org/ \\"
              echo "     --registry=https://registry.npmjs.org/"
            fi
            exit 1
          fi
          echo "✅ latest на React 18-сборке"
