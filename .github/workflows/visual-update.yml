name: Update Visual Snapshots

# Два входа, и оба нужны.
#
# `workflow_dispatch` — ручной путь: кнопка в Actions или `gh workflow run`
# из локальной сессии.
#
# `push` с маркером `[update-snapshots]` — путь для агентов. Облачные сессии
# не могут диспатчить workflow: запись в Actions API отдаёт 403 «Resource not
# accessible by integration» (наблюдение 2026-09-15, см. docs/ai/commits.md
# § «Облачные сессии»). Зато `git push` им доступен — на нём и строим триггер.
# Маркер в сообщении коммита повторяет механику `[no-pr]` из auto-pr.yml.
on:
  workflow_dispatch:
  push:
    branches:
      - 'TRI-*'
      - 'TRIPLEX-*'

# Пуш скриншотов идёт под PAT бота, поэтому GITHUB_TOKEN здесь только читает.
permissions:
  contents: read

jobs:
  update:
    name: Update baseline screenshots
    # Зацикливания нет: собственный коммит этого workflow маркера не содержит,
    # поэтому порождённый им push сюда не возвращается.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[update-snapshots]')
    runs-on: ubuntu-24.04
    steps:
      # persist-credentials: false — ниже выполняется `npm ci`, то есть
      # lifecycle-скрипты зависимостей. Токен с правом push в ветку не должен
      # лежать в .git/config, пока они работают; он подставляется точечно,
      # только в момент push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Build Storybook
        run: npm run storybook:build
      - name: Update snapshots
        run: npx start-server-and-test 'npx http-server storybook-static -p 6006' http://localhost:6006 test-visual:ci:update
      - name: Commit updated snapshots
        env:
          # Local pre-commit blocks __screenshots__ commits by design; disable Husky only in CI snapshot update.
          HUSKY: 0
          DUDIM_AI_GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
        run: |
          set -eu
          git config user.name "dudim-ai"
          git config user.email "dudim-ai@users.noreply.github.com"
          git add __screenshots__/
          if git diff --staged --quiet; then
            echo "No snapshot changes"
            exit 0
          fi

          # Без `[skip ci]` и под PAT бота — оба условия обязательны, чтобы
          # на коммите со скриншотами запустились проверки. Пуши, сделанные
          # GITHUB_TOKEN, workflow не порождают, а `[skip ci]` подавляет их
          # и для PAT. Без прогонов вершина PR остаётся без обязательных
          # проверок, и PR невозможно смержить (TRI-140).
          #
          # Префикса TRI-XXX намеренно нет: коммит машинный, а auto-pr.yml
          # создаёт PR только по коммитам в формате `TRI-XXX ...` — иначе
          # обновление скриншотов могло бы создать PR со случайным
          # заголовком. См. docs/ai/commits.md § «Формат коммитов».
          git commit -m "chore: update visual snapshots"

          REMOTE="https://x-access-token:${DUDIM_AI_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Ветка могла уйти вперёд, пока шёл прогон — подтягиваем перед пушем.
          git pull --rebase "${REMOTE}" "${GITHUB_REF_NAME}"
          git push "${REMOTE}" "HEAD:${GITHUB_REF_NAME}" \
            || { echo "❌ Push отклонён. Проверь, что dudim-ai не потерял права на ветку."; exit 1; }
