name: Release, publish npm package & deploy Storybook

on:
  # Обычный путь: человек создаёт GitHub Release, workflow публикует.
  release:
    types: [published]

  # Путь для локальных агентов и CLI: тот же прогон, но релиз создаётся
  # внутри workflow, после успешной публикации.
  #
  # Из облачной routine этот путь НЕ работает: прокси облачных сессий
  # запрещает любые триггеры релиза — `gh release create`, диспатч этого
  # workflow, repository_dispatch, создание/push тегов (TRI-117, зонд
  # 2026-08-14; диспатч нерелизных workflow проходит). Облако готовит
  # релиз и передаёт публикацию человеку.
  #
  # Почему не отдельный workflow «создать релиз»: релиз, созданный через
  # GITHUB_TOKEN, по правилам GitHub не триггерит другие workflow — этот
  # файл просто не запустился бы. Поэтому создание и публикация живут вместе.
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия и тег релиза, например 1.41.0"
        required: true
      target:
        description: "Ветка, на которую вешается тег"
        required: true
        default: main
      make_latest:
        description: "Пометить релиз как Latest (только для 1.x)"
        type: boolean
        default: false
      notes:
        description: "Текст release notes в markdown"
        required: true

permissions:
  contents: write   # нужно для создания релиза и загрузки ассетов

env:
  STORYBOOK_PREVIEW_BASE: "/var/www/storybook/data"
  STORYBOOK_URL_BASE: "https://storybook.triplex-dev.ru"
  # Единый источник тега для обоих триггеров.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Запускать workflow может любой с правом на Actions, а дальше идёт checkout
      # переданного ref и выполнение его npm-скриптов с npm-токеном и write-правами.
      # Поэтому пара «версия ↔ ветка» жёстко ограничена: 1.Y.0 только из main,
      # 0.Y.0 только из release-0. Проверка стоит до checkout намеренно.
      #
      # Гейт общий для обоих триггеров: на пути `release: published` ветку даёт
      # `target_commitish`. Оба скила создают релиз на ещё не существующем теге
      # и с явным `--target`, поэтому там всегда лежит имя ветки. Если же релиз
      # повесить на уже существующий тег, GitHub подставит ветку по умолчанию —
      # для 0.Y.0 это осознанный стоп: такой релиз надо пересоздать
      # с `--target release-0`.
      - name: Validate release inputs
        env:
          TARGET: ${{ github.event.release.target_commitish || inputs.target }}
        run: |
          if ! printf '%s' "${RELEASE_TAG}" | grep -qE '^[01]\.[0-9]+\.0$'; then
            echo "❌ tag=${RELEASE_TAG}: ожидается ровно 0.Y.0 или 1.Y.0 (минорный релиз, без prerelease)."
            exit 1
          fi
          case "${RELEASE_TAG}" in
            1.*) EXPECTED_TARGET=main ;;
            0.*) EXPECTED_TARGET=release-0 ;;
          esac
          if [ "${TARGET}" != "${EXPECTED_TARGET}" ]; then
            echo "❌ tag=${RELEASE_TAG} должен выпускаться из ветки ${EXPECTED_TARGET}, а не из ${TARGET}."
            exit 1
          fi

      # При `release: published` GITHUB_SHA — коммит, на который повешен тег,
      # и checkout по умолчанию взял бы именно его.
      # При `workflow_dispatch` диспатч идёт с `--ref main`, поэтому ветку
      # для сборки надо задать явно — иначе для 0.x собрался бы main.
      #
      # Важно: определение workflow при dispatch берётся из `--ref`, а на пути
      # `release: published` — из ветки по умолчанию. Копия этого файла
      # в `release-0` устаревшая и в обоих путях не используется; она подтянется
      # при следующем перелитии.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || github.sha }}
          # workflow не пушит в репозиторий; gh получает токен через env явно
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          scope: '@sberbusiness'
          always-auth: true

      - run: npm ci
      - run: npm run build

      # Публикация
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          echo "@sberbusiness:registry=https://registry.npmjs.org/" > .npmrc
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          cd dist
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${PKG_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "❌ dist/package.json version (${PKG_VERSION}) != release tag (${RELEASE_TAG})"
            exit 1
          fi
          case "${RELEASE_TAG}" in
            0.*|1.*) ;;
            *) echo "❌ Unknown version prefix: ${RELEASE_TAG}. Expected 0.* or 1.*."; exit 1 ;;
          esac
          # Повторный прогон после падения на заливке ассетов или деплое не должен
          # спотыкаться о «version already exists»: если ровно эта версия уже
          # в реестре, публикацию пропускаем и идём дальше — досоздавать релиз,
          # ассеты и Storybook.
          if npm view "@sberbusiness/triplex-next@${RELEASE_TAG}" version >/dev/null 2>&1; then
            echo "⚠️ ${RELEASE_TAG} уже опубликована в npm — публикацию пропускаем."
            exit 0
          fi
          # Порядок половин — не только договорённость скилов: latest встаёт
          # на последнюю опубликованную версию, поэтому 1.Y.0, вышедшая раньше
          # парной 0.Y.0, гарантированно оставит latest на React 17-сборке.
          # Гейт стоит после пропуска выше: повторный прогон по уже
          # опубликованной версии до него не доходит и восстановление не ломает.
          case "${RELEASE_TAG}" in
            1.*)
              PAIRED_V0="0.${RELEASE_TAG#1.}"
              if ! npm view "@sberbusiness/triplex-next@${PAIRED_V0}" version >/dev/null 2>&1; then
                echo "❌ Парная ${PAIRED_V0} не опубликована — React 17-половина обязана выйти первой."
                echo "   Выпустите ${PAIRED_V0} из release-0 и повторите (см. .agents/skills/release/SKILL.md)."
                exit 1
              fi
              ;;
          esac
          # dist-tag не указываем намеренно: теги не проносятся во внутренний
          # registry, `--tag` там игнорируется, и `latest` всегда встаёт на
          # последнюю опубликованную версию. Управляет этим порядок выпуска —
          # сначала 0.Y.0, следом 1.Y.0 (см. .agents/skills/release/SKILL.md).
          npm publish --access public

      # Релиз создаётся только на пути workflow_dispatch и только после того,
      # как пакет реально ушёл в npm: упавшая сборка или публикация не оставят
      # висящего релиза. Обратное не гарантируется — заливка ассетов и деплой
      # идут уже после создания, и их падение оставит релиз без dist.zip; такой
      # прогон можно перезапустить, публикация идемпотентна.
      # На пути `release: published` релиз уже существует.
      #
      # Значения идут через env, а не через ${{ }} прямо в run: их задаёт тот,
      # кто запускает workflow, и подстановка в shell была бы точкой инъекции.
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
          NOTES: ${{ inputs.notes }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          printf '%s' "$NOTES" > release-notes.md
          if [ "${MAKE_LATEST}" = "true" ]; then LATEST_FLAG="--latest"; else LATEST_FLAG="--latest=false"; fi
          gh release create "${RELEASE_TAG}" --target "${TARGET}" --title "${RELEASE_TAG}" \
            "${LATEST_FLAG}" --notes-file release-notes.md
          rm -f release-notes.md

      # Упаковать dist.zip как release asset.
      - name: Create dist.zip
        run: zip -r "dist-${RELEASE_TAG}.zip" dist

      # MCP-бандл собирается только для стабильных релизов React 18 (ровно 1.Y.0):
      # документация в 0.* (React 17) идентична, а два одинаковых бандла в разных
      # релизах сделали бы неоднозначным выбор источника для fetch-bundle.ts
      # в mcp-server. Проверка вынесена в отдельный шаг, потому что выражения
      # GitHub Actions не умеют регулярные выражения, а startsWith('1.') пропустил бы
      # и 1.40.1, и 1.4.0-beta.
      - name: Detect MCP bundle eligibility
        id: mcp
        env:
          # На пути workflow_dispatch поля release нет — релиз мы создаём сами
          # и всегда как стабильный, поэтому prerelease по умолчанию false.
          IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          if [[ "${IS_PRERELEASE}" == "false" && "${RELEASE_TAG}" =~ ^1\.[0-9]+\.0$ ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "MCP bundle не генерируется: tag=${RELEASE_TAG}, prerelease=${IS_PRERELEASE}."
          fi

      - name: Generate MCP bundle
        if: steps.mcp.outputs.eligible == 'true'
        run: npm run generateMcpData -- --out "mcp-data-${RELEASE_TAG}.json"

      # tag_name обязателен: без него action выводит тег из GITHUB_REF, а на пути
      # workflow_dispatch там `refs/heads/main`, а не `refs/tags/...` — action падает
      # с «GitHub Releases requires a tag». На пути `release: published` значение
      # совпадает с тем, что action вывел бы сам.
      #
      # fail_on_unmatched_files: по умолчанию action молча пропускает ненайденные
      # файлы — релиз опубликовался бы без архива, и это заметили бы уже потребители.
      - name: Upload build artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist-${{ env.RELEASE_TAG }}.zip
          fail_on_unmatched_files: true

      # Отдельным шагом: для 0.* бандла нет, и указывать его в files выше значило бы
      # ссылаться на несуществующий файл. Шаг идёт под тем же условием, что и
      # генерация, поэтому отсутствие файла здесь — тоже повод упасть.
      - name: Upload MCP bundle to GitHub Release
        if: steps.mcp.outputs.eligible == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: mcp-data-${{ env.RELEASE_TAG }}.json
          fail_on_unmatched_files: true

      # ---- Сборка и деплой Storybook ----
      - name: Build Storybook
        run: npm run storybook:build

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STORYBOOK_SSH_PRIVATE_KEY }}

      - name: Deploy Storybook to server
        env:
          SSH_USER: ${{ secrets.STORYBOOK_SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no "$SSH_USER" "mkdir -p $STORYBOOK_PREVIEW_BASE/releases/${RELEASE_TAG}"
          rsync -avz --delete storybook-static/ "$SSH_USER:$STORYBOOK_PREVIEW_BASE/releases/${RELEASE_TAG}/"

      - name: Output Storybook URL
        run: echo "Storybook deployed ${STORYBOOK_URL_BASE}/releases/${RELEASE_TAG}"