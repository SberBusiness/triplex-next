name: CI

on:
  pull_request:
    branches: [ '**' ]
  # На main проверки идут и после мержа: PR валидируется на своей базе, а два
  # зелёных по отдельности PR могут сложиться в красный main (переименовали
  # проп в одном, добавили использование старого в другом — текстового
  # конфликта нет). Здесь дополнительно проверяется итоговое состояние main.
  # После PR синхронизации release-0 проверяем и итоговый merge-коммит.
  # Именно этот прогон на вершине release-0 требуется предполёту релиза.
  push:
    branches: [ main, release-0 ]

# Проверкам нужен только исходник. Явный блок обязателен: без него джоба
# получает набор по умолчанию, а он в репозитории write.
permissions:
  contents: read

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Для pull_request HEAD — тестовый merge, первый родитель — целевая ветка.
          fetch-depth: 2
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - name: Test npm dependency report
        run: python3 -B -m unittest discover -s scripts/security
      - name: Report npm dependency changes
        if: github.event_name == 'pull_request'
        run: python3 scripts/security/dependency_report.py HEAD^1 HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Review vulnerable dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci

      - name: Check circular dependencies
        run: npm run deps:cycles

      - name: Build library
        run: npm run build
  
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test-unit:coverage
      - name: Upload unit coverage
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage

  ai-md-tokens:
    name: AI.md tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check design tokens in AI.md
        run: npm run syncAiMdTokens -- --check

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests
        run: npm run test-e2e
