name: Weekly release

# Еженедельный релиз целиком: предполёт → 0.Y.0 из release-0 → 1.Y.0 из main.
#
# Почему это workflow, а не облачная routine: прокси облачных сессий Claude
# режет write-пути api.github.com — `gh release create`, `gh workflow run`,
# создание и push тегов (TRI-119, зонд 2026-08-21). Изнутри Actions таких
# ограничений нет, поэтому расписание держит сам GitHub. За Claude остаётся
# чтение результата и отчёт в Linear.
#
# Что делает человек до запуска (docs/human/release.md):
#   1. домержить задачи спринта в main, дальше main заморожен;
#   2. пункты в stories/release-notes/v1/<VERSION>.mdx (пишутся по ходу спринта);
#   3. перелить main в release-0, разрешить конфликты React 17, запушить,
#      дождаться зелёного ci.yml;
#   4. к 13:45 проверить, что прогон стартовал — расписание опаздывает,
#      и если его нет, запустить workflow_dispatch руками.
# Всё остальное ниже.

on:
  # Минута намеренно некруглая. Расписание Actions — best-effort, и на начале
  # часа очередь максимальная: прогон 2026-08-28 опоздал на 11 часов,
  # 2026-09-04 — на 4 (TRI-138). Оба раза релиз к моменту прихода уже был
  # выпущен вручную через workflow_dispatch, а опоздавший прогон уходил
  # в пустышку. Гарантии сдвиг минуты не даёт.
  schedule:
    - cron: "23 10 * * 5" # пятница 13:23 МСК

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только предполёт, без публикации"
        type: boolean
        default: false

# Пуши в защищённые ветки идут под PAT бота, а не под GITHUB_TOKEN: он
# не входит в списки branch protection. Значит workflow'у достаточно чтения,
# а write выдан точечно джобам публикации.
permissions:
  contents: read

# Два релиза одновременно — гарантированная путаница с dist-tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Предполёт. Только чтения: ни одного коммита, ни одной публикации.
  # Не сошлось — тихий выход, а не падение: незавершённая подготовка это
  # штатный исход недели, а не поломка.
  # ------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    # actions: read — для чтения прогонов ci.yml на release-0. Явный блок
    # обнуляет все неперечисленные scope, а вызов `gh api` ниже заглушён
    # (`2>/dev/null || echo ""`), поэтому отказ в правах выглядел бы как
    # «на release-0 нет прогонов ci.yml» и тихо отменял релиз.
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      version: ${{ steps.check.outputs.version }}
      v0: ${{ steps.check.outputs.v0 }}
      next: ${{ steps.check.outputs.next }}
      next0: ${{ steps.check.outputs.next0 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight checks
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          fail() { echo "⏭️ Релиза не будет: $1"; { echo "## Релиза не будет"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }

          git fetch origin main release-0 --quiet

          CURRENT=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          MINOR=$(printf '%s' "${CURRENT}" | cut -d. -f2)
          case "${CURRENT}" in
            1.*.0) ;;
            *) fail "версия в main = \`${CURRENT}\`, ожидался формат 1.Y.0" ;;
          esac

          VERSION="1.$((MINOR + 1)).0"
          V0="0.$((MINOR + 1)).0"
          NEXT="1.$((MINOR + 2)).0"
          NEXT0="0.$((MINOR + 2)).0"
          echo "Кандидат: ${VERSION} / ${V0}"

          # Миноры веток должны совпадать — иначе ветки разъехались.
          R0=$(git show origin/release-0:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$(printf '%s' "${R0}" | cut -d. -f2)" != "${MINOR}" ]; then
            fail "миноры разъехались: main \`${CURRENT}\`, release-0 \`${R0}\`"
          fi

          # Триггер релиза — заполненные release notes. Файл существует всегда:
          # заготовку создаёт предыдущий релиз. Значение имеет содержимое.
          MDX="stories/release-notes/v1/${VERSION}.mdx"
          git show "origin/main:${MDX}" > /tmp/notes.mdx 2>/dev/null \
            || fail "\`${MDX}\` нет в main — предыдущий релиз не создал заготовку, это аномалия"
          if [ "$(grep -vcE '^[[:space:]]*$|^import |^<Meta |^<Title>|^<Heading>.*</Heading>$' /tmp/notes.mdx)" -eq 0 ]; then
            fail "\`${MDX}\` — пустая заготовка, с прошлого релиза ничего не приехало"
          fi

          # Релизов ещё нет.
          for T in "${VERSION}" "${V0}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${T}" >/dev/null 2>&1; then
              fail "релиз \`${T}\` уже существует"
            fi
          done

          # Перелитие сделано человеком. Список недостающих коммитов пишем
          # в summary отдельно: без него сообщение об отказе бесполезно.
          if ! git merge-base --is-ancestor origin/main origin/release-0; then
            {
              echo "## Релиза не будет"
              echo ""
              echo "Перелитие main → release-0 не сделано или устарело. Не хватает коммитов:"
              echo ""
              echo '```'
              git log origin/main --not origin/release-0 --oneline | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "⏭️ Релиза не будет: перелитие main → release-0 не сделано"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CI зелёный ровно на вершине release-0.
          TIP=$(git rev-parse origin/release-0)
          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=release-0&per_page=1" \
            --jq '.workflow_runs[0] | "\(.head_sha) \(.status) \(.conclusion)"' 2>/dev/null || echo "")
          if [ -z "${RUN}" ]; then fail "на release-0 нет прогонов ci.yml"; fi
          set -- ${RUN}
          if [ "$1" != "${TIP}" ]; then
            fail "последний прогон ci.yml на release-0 — коммит \`${1:0:8}\`, а вершина \`${TIP:0:8}\`: проверялось не то состояние"
          fi
          if [ "$2" != "completed" ] || [ "$3" != "success" ]; then
            fail "CI на вершине release-0 не зелёный: \`$2/$3\`"
          fi

          {
            echo "## Предполёт пройден"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Выпускаем | \`${V0}\`, затем \`${VERSION}\` |"
            echo "| main | \`${CURRENT}\` |"
            echo "| release-0 | \`${R0}\`, CI зелёный на \`${TIP:0:8}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "ready=true"
            echo "version=${VERSION}"
            echo "v0=${V0}"
            echo "next=${NEXT}"
            echo "next0=${NEXT0}"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # React 17-половина готовится первой. Порядок обратен номерам версий
  # намеренно: теги не проносятся во внутренний npm registry, `latest`
  # встаёт на последнюю публикацию. Значит 1.Y.0 обязана выйти второй.
  # ------------------------------------------------------------------
  prepare-react17:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false — принципиально. Иначе actions/checkout
      # положил бы PAT в .git/config, а ниже выполняются `npm ci` (lifecycle-
      # скрипты полутора тысяч зависимостей), тесты и сборка. Любой из этих
      # скриптов смог бы прочитать токен с правом прямого push в main.
      # Токен подставляется точечно, только в момент push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-0
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci

      # Гейты. CI на вершине release-0 проверял состояние ДО релизного коммита,
      # а он меняет версию и notes — поэтому прогон здесь обязателен.
      # `npm run build` в prebuild гоняет tsc по tsconfig.build.json; полный
      # tsc гейтом быть не может — он даёт давние ошибки в stories/.
      - run: npm run test-unit
      - run: npm run build

      - name: Transfer release notes v1 → v0
        id: notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          V0: ${{ needs.preflight.outputs.v0 }}
          NEXT0: ${{ needs.preflight.outputs.next0 }}
        run: |
          set -eu
          SRC="stories/release-notes/v1/${VERSION}.mdx"
          DST="stories/release-notes/v0/${V0}.mdx"

          # Заполненный человеком v0 не трогаем: он мог осознанно разойтись
          # с v1 там, где формулировка для React 17-сборки иная.
          if [ -f "${DST}" ] \
            && [ "$(grep -vcE '^[[:space:]]*$|^import |^<Meta |^<Title>|^<Heading>.*</Heading>$' "${DST}")" -ne 0 ]; then
            echo "ℹ️ ${DST} заполнен вручную — оставляем как есть."
            # Ниже шаг коммита ждёт на один изменённый файл меньше.
            echo "v0_written=false" >> "${GITHUB_OUTPUT}"
          else
            sed -e "s|<Meta title=\"release-notes/v1/${VERSION}\" />|<Meta title=\"release-notes/v0/${V0}\" />|" \
                -e "s|<Title>v${VERSION}</Title>|<Title>v${V0}</Title>|" \
                "${SRC}" > "${DST}"
            grep -q "release-notes/v0/${V0}" "${DST}" || { echo "❌ подмена <Meta> не сработала"; exit 1; }
            grep -q "<Title>v${V0}</Title>" "${DST}" || { echo "❌ подмена <Title> не сработала"; exit 1; }
            echo "✅ notes перенесены из ${SRC}"
            echo "v0_written=true" >> "${GITHUB_OUTPUT}"
          fi

          cat > "stories/release-notes/v0/${NEXT0}.mdx" <<EOF
          import { Meta, Title, Heading } from "@storybook/addon-docs/blocks";

          <Meta title="release-notes/v0/${NEXT0}" />

          <Title>v${NEXT0}</Title>

          <Heading>Изменения</Heading>
          EOF

      - name: Bump, commit and push
        env:
          V0: ${{ needs.preflight.outputs.v0 }}
          NEXT0: ${{ needs.preflight.outputs.next0 }}
          V0_WRITTEN: ${{ steps.notes.outputs.v0_written }}
          DUDIM_AI_GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
        run: |
          set -eu
          npm version "${V0}" --no-git-tag-version
          git config user.name "dudim-ai"
          git config user.email "dudim-ai@users.noreply.github.com"
          git add package.json package-lock.json \
            "stories/release-notes/v0/${V0}.mdx" "stories/release-notes/v0/${NEXT0}.mdx"
          # Точный список путей: `git add stories/release-notes/v0/` затянул бы
          # в релизный коммит любой посторонний файл в каталоге.
          #
          # Проверяем состав, а не количество. Файлов бывает и 4, и 3:
          # заполненный человеком `${V0}.mdx` шаг переноса оставляет как есть
          # (docs/human/release.md, шаг 5), и тогда в staged diff его нет.
          # Жёсткое `-ne 4` роняло бы ровно этот поддержанный сценарий.
          REQUIRED="package.json package-lock.json stories/release-notes/v0/${NEXT0}.mdx"
          if [ "${V0_WRITTEN}" = "true" ]; then
            REQUIRED="${REQUIRED} stories/release-notes/v0/${V0}.mdx"
          fi
          STAGED=$(git diff --cached --name-only)
          for f in ${REQUIRED}; do
            printf '%s\n' "${STAGED}" | grep -qxF "${f}" || {
              echo "❌ ожидали изменение ${f}, а его нет в релизном коммите:"
              printf '%s\n' "${STAGED}"
              exit 1
            }
          done
          COUNT=$(printf '%s\n' "${STAGED}" | grep -c . || true)
          EXPECTED=$(printf '%s\n' ${REQUIRED} | grep -c .)
          if [ "${COUNT}" -ne "${EXPECTED}" ]; then
            echo "❌ в релизном коммите ${COUNT} файлов вместо ${EXPECTED}:"
            printf '%s\n' "${STAGED}"
            exit 1
          fi
          # Без префикса TRI-XXX: у Actions нет доступа к Linear, номер задачи
          # взять неоткуда, а выдумывать нельзя. Исключение зафиксировано
          # в docs/ai/commits.md; связь с трекером даёт skill release-auto,
          # он заводит задачу по итогам прогона.
          git commit -m "Подготовка релиза ${V0}"
          # Токен только здесь и только в URL push: в .git/config он не оседает.
          # GITHUB_TOKEN не годится — он не входит в списки branch protection
          # на main, и его пуши не запускают другие workflow.
          git push "https://x-access-token:${DUDIM_AI_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:release-0

  publish-react17:
    needs: [preflight, prepare-react17]
    uses: ./.github/workflows/release.yml
    # Права переиспользуемому workflow выдаёт вызывающая джоба: объявления
    # внутри release.yml могут их только сузить. Без id-token здесь обмен
    # OIDC-токена на креденшл npm не состоится.
    #
    # id-token — необходимое, но не достаточное условие. npm сверяет trusted
    # publisher по имени вызывающего workflow, то есть по этому файлу,
    # а не по release.yml, где выполняется publish. Поэтому release-weekly.yml
    # заведён на npmjs отдельным trusted publisher'ом рядом с release.yml
    # (docs/human/release.md § «Что настроено один раз», TRI-152).
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ needs.preflight.outputs.v0 }}
      target: release-0
      make_latest: false
    secrets: inherit

  # ------------------------------------------------------------------
  # React 18-половина. Стартует только после подтверждённой публикации
  # 0.Y.0 — иначе `latest` остался бы на React 17-сборке.
  # ------------------------------------------------------------------
  prepare-react18:
    needs: [preflight, publish-react17]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Bump, commit and push release branch
        id: prepare
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NEXT: ${{ needs.preflight.outputs.next }}
          DUDIM_AI_GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
        run: |
          set -eu
          npm version "${VERSION}" --no-git-tag-version

          cat > "stories/release-notes/v1/${NEXT}.mdx" <<EOF
          import { Meta, Title, Heading } from "@storybook/addon-docs/blocks";

          <Meta title="release-notes/v1/${NEXT}" />

          <Title>v${NEXT}</Title>

          <Heading>Изменения</Heading>
          EOF

          git config user.name "dudim-ai"
          git config user.email "dudim-ai@users.noreply.github.com"
          git add package.json package-lock.json "stories/release-notes/v1/${NEXT}.mdx"
          COUNT=$(git diff --cached --name-only | wc -l)
          if [ "${COUNT}" -ne 3 ]; then
            echo "❌ в релизном коммите ${COUNT} файлов вместо 3:"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "Подготовка релиза ${VERSION}"

          # Прямым push'ом в main релизный коммит больше не едет: на main
          # включены обязательные проверки, а ci.yml и visual-test.yml
          # запускаются только на pull_request — на прямом push'е нужные
          # контексты не появились бы никогда, и он отклонялся бы вечно.
          # Поэтому коммит сначала уходит в релизную ветку, проверки идут
          # на её PR и привязываются к тому же SHA, а в main он попадает
          # fast-forward'ом — уже зелёным (шаг «Fast-forward main»).
          # Ветка одноразовая: force нужен для перезапуска упавшего прогона.
          BRANCH="prerelease-${VERSION}"
          git push --force "https://x-access-token:${DUDIM_AI_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          {
            echo "branch=${BRANCH}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # Смысл шага — прогнать обязательные проверки на релизном коммите.
      # PR здесь инструмент, а не ревью: мержить его никто не будет, GitHub
      # сам пометит его merged, когда коммит окажется в main.
      - name: Open PR and wait for required checks
        id: checks
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -eu
          find_pr() {
            gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --base main \
              --state open --json number --jq '.[0].number // empty'
          }

          # Перезапуск прогона после падения не должен плодить PR.
          PR=$(find_pr)
          if [ -z "${PR}" ]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH}" \
              --title "Подготовка релиза ${VERSION}" \
              --body "Релизный коммит еженедельного прогона. PR открыт, чтобы прогнать обязательные проверки; в main коммит уедет fast-forward'ом тем же прогоном."
            PR=$(find_pr)
          fi
          [ -n "${PR}" ] || { echo "❌ PR для ветки ${BRANCH} не создан"; exit 1; }
          echo "PR #${PR}"
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"

          # Прогоны регистрируются не мгновенно. Различаем по коду выхода
          # `gh pr checks`: 0 — все зелёные, 8 — проверки есть и ещё идут,
          # прочее (включая 1 — «no checks reported») — ждём дальше.
          for _ in $(seq 1 30); do
            gh pr checks "${PR}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && break
            [ $? -eq 8 ] && break
            sleep 10
          done

          # --required: сторонние контексты (preview Storybook) на релиз
          # не влияют. --fail-fast: упавшая проверка останавливает ожидание,
          # публиковать всё равно нечего.
          gh pr checks "${PR}" --repo "${GITHUB_REPOSITORY}" --required --watch --fail-fast

      # Ветку и PR после падения намеренно НЕ удаляем: в них лежит релизный
      # коммит и результаты проверок — то, по чему разбирают причину. Но
      # молча оставленный мусор через месяц уже никто не свяжет с релизом,
      # поэтому пишем в summary, что именно осталось и что с этим делать.
      - name: Report leftovers on failure
        if: failure()
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          PR: ${{ steps.checks.outputs.pr }}
        run: |
          set -u
          if [ -z "${BRANCH}" ]; then
            {
              echo "### Релиз остановлен до создания релизной ветки"
              echo ""
              echo "В репозитории ничего не осталось, публикации не было."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Релиз остановлен на проверках"
            echo ""
            echo "Осталось в репозитории:"
            echo ""
            echo "- ветка \`${BRANCH}\` с релизным коммитом"
            if [ -n "${PR}" ]; then
              echo "- PR #${PR} — в нём видно, какая проверка упала"
            else
              echo "- PR создать не успели"
            fi
            echo ""
            echo "Ничего не опубликовано. Почини причину и перезапусти прогон:"
            echo "он переиспользует ветку и PR, force-push обновит коммит."
            echo "Если релиз на этой неделе решено не выпускать — удали ветку,"
            echo "PR закроется сам."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
          DUDIM_AI_GH_TOKEN: ${{ secrets.DUDIM_AI_GH_TOKEN }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          SHA: ${{ steps.prepare.outputs.sha }}
          PR: ${{ steps.checks.outputs.pr }}
        run: |
          set -eu
          # Тот же самый коммит, что проверялся в PR: обязательные проверки
          # на main смотрят на SHA, и зелёные контексты уже на месте.
          # Требование ревью боту прощает bypass required pull requests
          # (см. docs/human/release.md § «Что настроено один раз»).
          REMOTE="https://x-access-token:${DUDIM_AI_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push "${REMOTE}" "${SHA}:main"; then
            # Две принципиально разные причины отказа, и лечатся они по-разному.
            # Различаем по тому, осталась ли вершина main родителем релизного
            # коммита: если нет — во время релиза кто-то влил PR, и push
            # отклонён как non-fast-forward, а не правилами ветки.
            git fetch "${REMOTE}" main --quiet 2>/dev/null || true
            TIP=$(git rev-parse FETCH_HEAD 2>/dev/null || echo "")
            PARENT=$(git rev-parse "${SHA}^" 2>/dev/null || echo "")
            echo "❌ push релизного коммита в main отклонён."
            if [ -n "${TIP}" ] && [ "${TIP}" != "${PARENT}" ]; then
              echo "   Причина: main ушёл вперёд во время релиза."
              echo "   Ожидали вершину ${PARENT:0:8}, а там ${TIP:0:8}."
              echo "   Кто-то влил PR после старта прогона — main на время релиза"
              echo "   должен быть заморожен (docs/human/release.md § «Заморозка»)."
              echo "   Перезапусти прогон: он пересоберёт релизный коммит от новой вершины."
            else
              echo "   Причина: правила ветки. Имена обязательных проверок должны"
              echo "   совпадать с именами джоб ci.yml и visual-test.yml, а dudim-ai —"
              echo "   оставаться в push restrictions и в bypass required pull requests."
            fi
            echo "   Коммит сохранён в ветке ${BRANCH}, PR #${PR}."
            exit 1
          fi

          # Ветку удаляем только после того, как GitHub пометит PR как merged:
          # удаление раньше закрыло бы его как отклонённый. Опрашиваем состояние,
          # а не спим наугад — ставка на длительность чужой асинхронной операции
          # даёт ровно тот исход, от которого мы защищаемся.
          MERGED=""
          for _ in $(seq 1 12); do
            STATE=$(gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state 2>/dev/null || echo "")
            if [ "${STATE}" = "MERGED" ]; then MERGED=1; break; fi
            sleep 5
          done

          if [ -n "${MERGED}" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              || echo "ℹ️ ветку ${BRANCH} удалить не удалось — удали вручную"
          else
            echo "ℹ️ PR #${PR} за минуту не помечен merged — ветку ${BRANCH} оставляем."
            echo "   Коммит уже в main, на релиз это не влияет: удали ветку вручную,"
            echo "   когда GitHub закроет PR."
          fi

  publish-react18:
    needs: [preflight, prepare-react18]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ needs.preflight.outputs.version }}
      target: main
      make_latest: true
    secrets: inherit

  # ------------------------------------------------------------------
  # Финальная проверка. Джоба ходит на npmjs: checkout'а здесь нет, .npmrc
  # взяться неоткуда, @sberbusiness:registry не задан. После TRI-146 latest
  # там между половинами не двигается вовсе: 0.Y.0 уходит под тегом react17,
  # поэтому сверяются оба тега. Во внутреннем registry dist-tags нет, latest
  # определяется порядком появления версий, и его закрывает порядок половин.
  # ------------------------------------------------------------------
  verify:
    needs: [preflight, publish-react18]
    runs-on: ubuntu-latest

    steps:
      - name: Check dist-tags
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          V0: ${{ needs.preflight.outputs.v0 }}
        run: |
          set -eu
          LATEST=$(npm view @sberbusiness/triplex-next dist-tags.latest)
          REACT17=$(npm view @sberbusiness/triplex-next dist-tags.react17)
          echo "dist-tags.latest = ${LATEST}"
          echo "dist-tags.react17 = ${REACT17}"
          {
            echo "## Релиз выпущен"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| \`${V0}\` | опубликована |"
            echo "| \`${VERSION}\` | опубликована |"
            echo "| \`dist-tags.latest\` | \`${LATEST}\` |"
            echo "| \`dist-tags.react17\` | \`${REACT17}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # react17 — тег, по которому ставятся React 17-потребители
          # (stories/Introduction.mdx). Прогон им не роняем: обе версии уже
          # опубликованы, релиз состоялся, а `npm install` по умолчанию
          # определяет latest, который проверяется ниже и остаётся гейтом.
          # Но и молчать нельзя: до TRI-146 тег не двигался с августа,
          # и `@react17` полтора месяца отдавал давнюю сборку.
          # Проверка идёт перед гейтом latest — иначе при красном latest
          # расхождение по react17 не попало бы в отчёт вовсе.
          if [ "${REACT17}" != "${V0}" ]; then
            echo "⚠️ dist-tags.react17 = ${REACT17}, ожидалось ${V0}."
            {
              echo ""
              echo "⚠️ \`dist-tags.react17\` = \`${REACT17}\`, ожидалось \`${V0}\`:"
              echo "\`npm i @sberbusiness/triplex-next@react17\` отдаёт не ту сборку."
              echo "Почини:"
              echo ""
              echo '```bash'
              echo "npm dist-tag add @sberbusiness/triplex-next@${V0} react17 \\"
              echo "  --@sberbusiness:registry=https://registry.npmjs.org/ \\"
              echo "  --registry=https://registry.npmjs.org/"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${LATEST}" != "${VERSION}" ]; then
            echo "❌ latest = ${LATEST}, ожидалось ${VERSION}."
            echo "   npm install отдаёт потребителям не ту сборку — почини немедленно:"
            echo "   npm dist-tag add @sberbusiness/triplex-next@${VERSION} latest \\"
            echo "     --@sberbusiness:registry=https://registry.npmjs.org/ \\"
            echo "     --registry=https://registry.npmjs.org/"
            exit 1
          fi
          echo "✅ latest на React 18-сборке"
