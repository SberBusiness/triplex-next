name: Deploy Storybook Preview

# This workflow builds untrusted PR code. It never receives deployment keys.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: storybook-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !startsWith(github.head_ref, 'prerelease-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test deployment scripts
        run: |
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
          node --test scripts/deploy/test-storybook-publication.cjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run storybook:build
      - name: Package static files
        run: tar -czf "$RUNNER_TEMP/storybook.tar.gz" -C storybook-static .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook--pr-${{ github.event.pull_request.number }}--${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/storybook.tar.gz
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
          overwrite: true
