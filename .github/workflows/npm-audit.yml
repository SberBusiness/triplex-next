name: npm audit

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [main, release-0]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Read npm manifests from one branch revision
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BRANCH: ${{ matrix.branch }}
        run: |
          tree="$RUNNER_TEMP/npm-tree.json"
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$AUDIT_BRANCH" > "$tree"
          lock=$(jq -er 'if any(.tree[]; .path == "npm-shrinkwrap.json")
                         then "npm-shrinkwrap.json" else "package-lock.json" end' "$tree")
          for file in package.json "$lock"; do
            blob=$(jq -er --arg file "$file" '.tree[] | select(.type == "blob" and .path == $file) | .sha' "$tree")
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/git/blobs/$blob" > "$file"
          done
      - name: Audit locked packages including development dependencies
        run: npm audit --package-lock-only --include=dev --ignore-scripts --audit-level=high
