name: CI

on:
  pull_request:
    branches: [ '**' ]
  # На main проверки идут и после мержа: PR валидируется на своей базе, а два
  # зелёных по отдельности PR могут сложиться в красный main (переименовали
  # проп в одном, добавили использование старого в другом — текстового
  # конфликта нет). Обязательные проверки такого не ловят, а «Require branches
  # to be up to date» ради этого держать дорого: каждый мерж заставлял бы
  # перепрогонять все открытые PR. Здесь — один прогон на мерж.
  # В release-0 мержат напрямую, без PR — иначе перелитие main остаётся непроверенным
  # до момента релиза. Триггер валидирует ветку сразу после push.
  push:
    branches: [ main, release-0 ]

# Проверкам нужен только исходник. Явный блок обязателен: без него джоба
# получает набор по умолчанию, а он в репозитории write.
permissions:
  contents: read

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci

      - name: Check circular dependencies
        run: npm run deps:cycles

      - name: Build library
        run: npm run build
  
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test-unit:coverage
      - name: Upload unit coverage
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-coverage
          path: coverage

  ai-md-tokens:
    name: AI.md tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check design tokens in AI.md
        run: npm run syncAiMdTokens -- --check

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Иначе токен оседает в .git/config, а ниже выполняется npm ci —
          # lifecycle-скрипты зависимостей смогли бы его прочитать.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests
        run: npm run test-e2e
